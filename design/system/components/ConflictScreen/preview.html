<!-- @dsCard group="Screens" height=800 width=1280 page=true subtitle="Conflict: both sides, a suggested choice with its reason, Compare files and Decide later" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title>
<style>html,body{margin:0;background:var(--bg-100);} .cf-side dt{color:var(--ink-muted)} .cf-side dd{margin:0}</style>
</head>
<body class="gs-root">
<div id="root"></div>
<script>
var G = window.GameSync, h = React.createElement;

function rail(cur){return h(G.SideRail,{current:cur,items:[
  {id:'search',icon:'search',label:'Search'},
  {id:'home',icon:'home',label:'Home',sep:true},
  {id:'library',icon:'library',label:'Game library'},
  {id:'saves',icon:'saves',label:'Save manager',sep:true,dot:'warn',dotLabel:'1 game needs you'},
  {id:'log',icon:'terminal',label:'Console'},
  {id:'settings',icon:'settings',label:'Settings',bottom:true}]})}
function crumb(parent,here){return h('nav',{'aria-label':'Breadcrumb',className:'gs-row',style:{gap:6,font:'500 13px/20px var(--font-sans)'}},h('a',{href:'#',className:'gs-muted',style:{textDecoration:'none'}},parent),h(G.Icon,{name:'chevronRight',size:14}),h('span',{'aria-current':'page'},here));}
function topbar(left,right){return h('header',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:16}},left,h('div',{className:'gs-row',style:{flexWrap:'nowrap'}},right));}

var SIDES=[
  {where:'This PC',pc:'DESKTOP',newest:true,suggested:true,rows:[['Saved','Today 21:04'],['Session','1 h 52 min, started from GameSync'],['Since the last sync','2 sessions, 3 h 10 min'],['Size','11.4 MB, 2 files'],['Changed files','S0000.sl2, S0000.sl2.bak',true]]},
  {where:'In the cloud, from',pc:'LAPTOP',rows:[['Saved','Today 19:30'],['Session','47 min, started from Steam'],['Since the last sync','1 session, 47 min'],['Size','11.4 MB, 2 files'],['Changed files','S0000.sl2, S0000.sl2.bak',true]]}];
var FILES=[
  {id:'f1',file:'S0000.sl2',desk:'11.4 MB · 21:04',lap:'11.4 MB · 19:30',what:'Changed on both PCs'},
  {id:'f2',file:'S0000.sl2.bak',desk:'11.4 MB · 20:58',lap:'11.4 MB · 19:29',what:'Changed on both PCs'}];

function Side(p){
 return h(G.Card,{className:'cf-side',style:{gap:14}},
  h('div',{className:'gs-row',style:{justifyContent:'space-between',flexWrap:'nowrap'}},
   h('div',null,h('div',{className:'overline gs-faint',style:{textTransform:'uppercase'}},p.where),h('div',{className:'gs-mono',style:{font:'600 20px/26px var(--font-mono)'}},p.pc)),
   p.newest?h('span',{className:'gs-tag',style:{background:'var(--secondary-soft)',color:'var(--ink)'}},'Newest'):null),
  h('dl',{style:{margin:0,display:'grid',gridTemplateColumns:'150px minmax(0,1fr)',rowGap:8,columnGap:12}},
   p.rows.map(function(r){return [h('dt',{key:r[0]+'t'},r[0]),h('dd',{key:r[0]+'d',className:r[2]?'gs-mono':null,style:r[2]?{fontSize:13}:null},r[1])];})),
  h(G.Button,{variant:p.suggested?'primary':'secondary',icon:'check',style:{alignSelf:'flex-start'}},'Keep '+p.pc+'’s'));
}

function App(){
 var cmp=React.useState(true);
 return h('div',{style:{width:1280,height:800,display:'flex',background:'var(--bg-100)'}},
  rail('saves'),
  h('main',{style:{flex:1,minWidth:0,padding:'20px 24px',display:'flex',flexDirection:'column',gap:16}},
   topbar(crumb('Save manager','Sekiro: Shadows Die Twice'),
     [h(G.IconButton,{key:1,icon:'sync',label:'Sync now'}),h(G.IconButton,{key:2,icon:'cloud',label:'Google Drive connected'}),h(G.IconButton,{key:3,icon:'monitor',label:'This PC: DESKTOP'})]),
   h('header',{style:{display:'flex',flexDirection:'column',gap:6}},
     h('div',null,h(G.StatusBadge,{status:'conflict',label:'Conflict · waiting for you'})),
     h('h1',{className:'page-title',style:{margin:0}},'Sekiro changed on two PCs'),
     h('p',{className:'gs-muted',style:{margin:0,maxWidth:760}},'DESKTOP saved at 21:04 and LAPTOP at 19:30, both after the last sync. Both copies are safe. Pick the one to carry on with; the other stays pinned in history, and you can swap back later.')),
   h(G.Card,{style:{padding:'12px 16px'}},h('div',{className:'gs-row',style:{flexWrap:'nowrap',gap:12}},
     h(G.Icon,{name:'info',size:18}),
     h('div',{style:{flex:1}},h('strong',{style:{fontWeight:600}},'Suggested: keep DESKTOP’s. '),'It’s the newest save and the longer play. You’re asked because Sekiro is set to Always ask.'),
     h(G.Button,{size:'sm',variant:'ghost',icon:'settings'},'Change for this game'))),
   h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}},SIDES.map(function(s){return h(Side,Object.assign({key:s.pc},s));})),
   cmp[0]?h(G.ConsoleTable,{command:'compare sekiro --this-pc --cloud',toolbar:h('span',null,'2 files differ · settings files stay per PC'),rows:FILES,columns:[{key:'file',label:'File'},{key:'desk',label:'DESKTOP',align:'right'},{key:'lap',label:'LAPTOP',align:'right'},{key:'what',label:'What changed'}]}):null,
   h('div',{className:'gs-row',style:{gap:12,marginTop:'auto'}},
     h(G.Button,{variant:'secondary',icon:cmp[0]?'chevronDown':'chevronRight','aria-expanded':cmp[0],onClick:function(){cmp[1](!cmp[0])}},'Compare files'),
     h(G.Button,{variant:'ghost',icon:'clock'},'Decide later'),
     h('span',{className:'gs-muted',style:{fontSize:13}},'Until you decide, Sekiro won’t upload or download, and each PC keeps playing its own copy.'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>

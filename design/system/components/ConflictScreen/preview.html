<!-- @dsCard group="Screens" height=800 width=1280 page=true subtitle="Conflict: both sides, a suggested choice with its reason, Compare files and Decide later; settled, Swap" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title>
<style>html,body{margin:0;background:var(--bg-100);} .cf-crumb{display:flex;align-items:center;gap:6px;min-width:0;font:500 13px/20px var(--font-sans)} .cf-crumb button{border:0;background:none;padding:0;color:var(--ink-muted);font:inherit;cursor:pointer;white-space:nowrap} .cf-crumb button:hover{color:var(--ink);text-decoration:underline} .cf-crumb button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:2px}</style>
</head>
<body class="gs-root">
<div id="root"></div>
<script>
var G = window.GameSync, h = React.createElement;

var ART = "data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%201200%20500%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Crect%20width%3D%271200%27%20height%3D%27500%27%20fill%3D%27%231b2a33%27/%3E%3Ccircle%20cx%3D%27860%27%20cy%3D%27150%27%20r%3D%2770%27%20fill%3D%27%237fe6f2%27%20opacity%3D%27.35%27/%3E%3Cpath%20d%3D%27M0%20330%20L180%20200%20L330%20300%20L520%20150%20L700%20290%20L880%20190%20L1200%20320%20V500%20H0Z%27%20fill%3D%27%23223640%27/%3E%3Cpath%20d%3D%27M0%20400%20L220%20290%20L420%20380%20L640%20270%20L860%20370%20L1040%20300%20L1200%20360%20V500%20H0Z%27%20fill%3D%27%23182730%27/%3E%3Cpath%20d%3D%27M0%20460%20L300%20390%20L600%20450%20L900%20380%20L1200%20440%20V500%20H0Z%27%20fill%3D%27%2310191f%27/%3E%3C/svg%3E";

function rail(cur){return h(G.SideRail,{current:cur,items:[
  {id:'search',icon:'search',label:'Search'},
  {id:'home',icon:'home',label:'Home',sep:true},
  {id:'library',icon:'library',label:'Game library'},
  {id:'achievements',icon:'trophy',label:'Achievements'},
  {id:'saves',icon:'saves',label:'Save manager',sep:true,dot:'warn',dotLabel:'1 conflict'},
  {id:'log',icon:'terminal',label:'Console'},
  {id:'settings',icon:'settings',label:'Settings',bottom:true}]})}
// Back at the top left and the breadcrumb, as on every page below the rail (Navigation and feedback).
function header(){return h('header',{className:'gs-row',style:{flexWrap:'nowrap',gap:12,minHeight:40}},
  h(G.Button,{size:'sm',variant:'secondary',icon:'arrowLeft',title:'Back (Esc)'},'Back'),
  h('nav',{'aria-label':'Breadcrumb',className:'cf-crumb'},h('button',{type:'button'},'Save manager'),h(G.Icon,{name:'chevronRight',size:14}),
    h('button',{type:'button'},'Sekiro: Shadows Die Twice'),h(G.Icon,{name:'chevronRight',size:14}),h('span',{'aria-current':'page'},'Conflict')));}
// #settled: the same conflict after newest wins settled it, with Swap.
var SETTLED = location.hash === '#settled';

var SIDES=[
  {where:SETTLED?'Current, from':'This PC',pc:'DESKTOP',newest:true,suggested:true,rows:[['Saved','Today 21:04'],['Session','1 h 52 min'],['Since the last sync','2 sessions, 3 h 10 min'],['Size','11.4 MB, 2 files'],['Changed files','S0000.sl2, S0000.sl2.bak',true]]},
  {where:SETTLED?'Pinned, from':'In the cloud, from',pc:'LAPTOP',rows:[['Saved','Today 19:30'],['Session','47 min'],['Since the last sync','1 session, 47 min'],['Size','11.4 MB, 2 files'],['Changed files','S0000.sl2, S0000.sl2.bak',true]]}];
var FILES=[
  {id:'f1',file:'S0000.sl2',desk:'11.4 MB · 21:04',lap:'11.4 MB · 19:30',what:'Changed on both PCs'},
  {id:'f2',file:'S0000.sl2.bak',desk:'11.4 MB · 20:58',lap:'11.4 MB · 19:29',what:'Changed on both PCs'}];

function Side(p){
 return h(G.Card,{className:'cf-side',style:{gap:14}},
  h('div',{className:'gs-row',style:{justifyContent:'space-between',flexWrap:'nowrap'}},
   h('div',null,h('div',{className:'overline gs-faint',style:{textTransform:'uppercase'}},p.where),h('div',{className:'gs-mono',style:{font:'600 20px/26px var(--font-mono)'}},p.pc)),
   p.newest?h('span',{className:'gs-tag',style:{background:'var(--secondary-soft)',color:'var(--ink)'}},'Newest'):null),
  h(G.Facts,{items:p.rows.map(function(r){return {label:r[0],value:r[1],mono:!!r[2]};})}),
  // Keeping this PC's uploads it at once; keeping another PC's writes its files here, so it asks first in a small flyout.
  SETTLED?null:h(G.Button,{variant:p.suggested?'primary':'secondary',icon:'check',style:{alignSelf:'flex-start'},'aria-haspopup':p.where==='This PC'?undefined:'dialog'},'Keep '+p.pc+'’s'));
}

function App(){
 var cmp=React.useState(true);
 return h(G.ThemeScope,{strength:'glass',art:ART,style:{width:1280,height:800,display:'flex'}},
  rail('saves'),
  h('main',{style:{flex:1,minWidth:0,padding:'20px 24px',display:'flex',flexDirection:'column',gap:16}},
   header(),
   h('header',{style:{display:'flex',flexDirection:'column',gap:6}},
     h('div',null,h(G.StatusBadge,{status:'conflict',label:SETTLED?'Conflict · resolved':'Conflict · waiting for you'})),
     h('h1',{className:'page-title',style:{margin:0}},SETTLED?'Newest kept: DESKTOP’s save':'Sekiro changed on two PCs'),
     h('p',{className:'gs-muted',style:{margin:0,maxWidth:760}},SETTLED
       ?'Sekiro changed on DESKTOP and on LAPTOP, and GameSync kept the newest save. LAPTOP’s is pinned in history, so nothing was lost.'
       :'DESKTOP saved at 21:04 and LAPTOP at 19:30, both after the last sync. Both copies are safe. Pick the one to carry on with; the other stays pinned in history, and you can swap back later.')),
   h(G.Card,{style:{padding:'12px 16px'}},h('div',{className:'gs-row',style:{flexWrap:'nowrap',gap:12}},
     h(G.Icon,{name:'info',size:18}),
     SETTLED
       ?h('div',{style:{flex:1}},h('strong',{style:{fontWeight:600}},'Want LAPTOP’s instead? '),'Swap switches to it; the files there now are kept as a version first.')
       :h('div',{style:{flex:1}},h('strong',{style:{fontWeight:600}},'Suggested: keep DESKTOP’s. '),'It’s the newest save and the longer play. You’re asked because Sekiro is set to Always ask.'),
     SETTLED
       ?h(G.Button,{variant:'primary',icon:'sync','aria-haspopup':'dialog'},'Swap to LAPTOP’s')
       :h(G.Button,{size:'sm',variant:'ghost',icon:'settings'},'Change for this game'))),
   h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}},SIDES.map(function(s){return h(Side,Object.assign({key:s.pc},s));})),
   cmp[0]?h(G.ConsoleTable,{command:'compare sekiro --this-pc --cloud',toolbar:h('span',null,'2 files differ · settings files stay per PC'),rows:FILES,columns:[{key:'file',label:'File'},{key:'desk',label:'DESKTOP',align:'right'},{key:'lap',label:'LAPTOP',align:'right'},{key:'what',label:'What changed'}]}):null,
   h('div',{className:'gs-row',style:{gap:12,marginTop:'auto'}},
     h(G.Button,{variant:'secondary',icon:cmp[0]?'chevronDown':'chevronRight','aria-expanded':cmp[0],onClick:function(){cmp[1](!cmp[0])}},'Compare files'),
     SETTLED?null:h(G.Button,{variant:'ghost',icon:'clock'},'Decide later'),
     SETTLED?null:h('span',{className:'gs-muted',style:{fontSize:13}},'Until you decide, Sekiro won’t upload or download, and each PC keeps playing its own copy.'))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>

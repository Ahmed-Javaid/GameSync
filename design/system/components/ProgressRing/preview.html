<!-- @dsCard group="Achievements" height=400 subtitle="Progress ring: a game's achievements unlocked, and a Zenith's at 100%, gold to red and glowing, with its moment" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title>
<style>html,body{margin:0;background:var(--bg-100);} .pv{padding:48px 48px 24px;display:flex;gap:56px;align-items:center;flex-wrap:wrap} .pv figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px} .pv figcaption{font:400 12px/16px var(--font-sans);color:var(--ink-faint)}</style>
</head>
<body class="gs-root">
<div id="root" class="pv"></div>
<script>
var G = window.GameSync, h = React.createElement;
function fig(el, cap){ return h('figure',{key:cap},el,h('figcaption',null,cap)); }
// The moment, played again from its button (the app plays it once, the first time a game's 100% is seen).
function Moment(){
  var n = React.useState(0);
  return h('figure',null,h(G.ProgressRing,{key:n[0],value:100,size:128,tone:'zenith',moment:true,sub:'34 / 34'}),
    h('figcaption',null,'The moment, the first time'),h(G.Button,{size:'sm',variant:'ghost',icon:'sync',onClick:function(){n[1](n[0]+1)}},'Play it again'));
}
ReactDOM.createRoot(document.getElementById('root')).render([
  fig(h(G.ProgressRing,{value:72,size:128,sub:'123 / 171'}),'A game’s page'),
  fig(h(G.ProgressRing,{value:100,size:128,tone:'zenith',sub:'34 / 34'}),'100%: a Zenith, glowing'),
  h(Moment,{key:'m'}),
  fig(h(G.ProgressRing,{value:19,size:76,sub:'5 / 26'}),'Home'),
  fig(h(G.ProgressRing,{value:3,size:40,stroke:4,label:'3%'}),'A row: how rare'),
  fig(h(G.ProgressRing,{value:0,size:76,sub:'0 / 53'}),'None yet')
]);
</script>
</body>
</html>

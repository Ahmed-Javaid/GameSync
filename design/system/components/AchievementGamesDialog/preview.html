<!-- @dsCard group="Achievements" height=840 subtitle="Achievements by game, from Settings: every game, whether it counts and whether GameSync shows its popup (off where a launcher shows its own)" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title>
<style>html,body{margin:0;background:var(--bg-100);} .pv{padding:24px;display:flex;justify-content:center}</style>
</head>
<body class="gs-root">
<div id="root" class="pv"></div>
<script>
var G = window.GameSync, h = React.createElement;
function cover(hue){ var svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 300'><rect width='200' height='300' fill='hsl("+hue+",30%,16%)'/><circle cx='140' cy='90' r='38' fill='hsl("+hue+",70%,62%)' opacity='.5'/><path d='M0 220 L70 160 L130 210 L200 150 V300 H0Z' fill='hsl("+hue+",70%,62%)' opacity='.35'/></svg>"; return "data:image/svg+xml,"+encodeURIComponent(svg); }
var GAMES=[
  {id:'apex',name:'Apex Legends',art:cover(10),count:'12 of 50',launcher:'Steam',antiCheat:true},
  {id:'bloons',name:'Bloons TD 6',art:cover(200),count:'63 of 156',launcher:'Steam'},
  {id:'core',name:'Core Keeper',art:cover(140),count:'26 of 59',launcher:'Steam'},
  {id:'cs2',name:'Counter-Strike 2',art:cover(30),count:'1 of 1',zenith:true,launcher:'Steam'},
  {id:'geo',name:'GeoGuessr Steam Edition',art:cover(100),count:'8 of 45',launcher:'Steam'},
  {id:'hd2',name:'Helldivers 2',art:cover(220),count:'3 of 38',launcher:'Steam'},
  {id:'l4d2',name:'Left 4 Dead 2',art:cover(50),count:'21 of 101',launcher:'Steam'},
  {id:'ror2',name:'Risk of Rain 2',art:cover(190),count:'123 of 171',launcher:'Steam'},
  {id:'valheim',name:'Valheim',art:cover(170),count:'1 of 53',launcher:'Steam'}];
function App(){
  var off=React.useState(['hd2']), pop=React.useState(['ror2']);
  var games=GAMES.map(function(g){return Object.assign({},g,{counted:off[0].indexOf(g.id)<0,popup:pop[0].indexOf(g.id)>=0});});
  return h(G.AchievementGamesDialog,{games:games,
    onCount:function(id,v){off[1](v?off[0].filter(function(x){return x!==id}):off[0].concat([id]))},
    onPopup:function(id,v){pop[1](v?pop[0].concat([id]):pop[0].filter(function(x){return x!==id}))},
    onClose:function(){}});
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>

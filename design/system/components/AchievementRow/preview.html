<!-- @dsCard group="Achievements" height=380 subtitle="A row of every achievement: unlocked with its date, locked with how many players have it, hidden kept secret" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title>
<style>html,body{margin:0;background:var(--bg-100);} .pv{padding:24px;max-width:560px}</style>
</head>
<body class="gs-root">
<div id="root" class="pv"></div>
<script>
var G = window.GameSync, h = React.createElement, useState = React.useState;
function achIcon(seed){ var hues=[18,200,280,140,45,340,180,95], marks=['M50 16 L60 40 L86 40 L65 57 L73 84 L50 68 L27 84 L35 57 L14 40 L40 40Z','M50 14 L80 30 L80 56 C80 73 66 83 50 90 C34 83 20 73 20 56 L20 30Z','M50 16 C66 36 76 50 76 64 A26 26 0 0 1 24 64 C24 50 34 36 50 16Z','M20 76 L50 20 L80 76Z','M28 28 L72 72 M72 28 L28 72','M26 50 A24 24 0 1 0 74 50 A24 24 0 1 0 26 50'];
  var hu=hues[seed%hues.length], m=marks[seed%marks.length];
  var svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='g' cx='30%' cy='25%' r='95%'><stop offset='0' stop-color='hsl("+hu+",72%,62%)'/><stop offset='1' stop-color='hsl("+hu+",45%,12%)'/></radialGradient></defs><rect width='100' height='100' fill='url(#g)'/><path d='"+m+"' fill='rgba(255,255,255,.18)' stroke='rgba(255,255,255,.92)' stroke-width='5' stroke-linejoin='round' stroke-linecap='round'/></svg>";
  return "data:image/svg+xml,"+encodeURIComponent(svg); }
var ITEMS = [
  {name:'Eclipse 8',desc:'Beat the game on Eclipse 8 with any survivor.',icon:achIcon(4),pct:2.7,when:'Today'},
  {name:'The Long Road',desc:'Complete the first stage three times in one run.',icon:achIcon(1),pct:41,when:'26 Sep'},
  {name:'Mercenary: Mastery',desc:'As Mercenary, beat the game on Monsoon.',icon:achIcon(0),pct:8.9,state:'locked'},
  {state:'hidden',pct:3.1},
  {name:'Newtist',desc:'Discover and activate 8 unique Newt Altars.',icon:achIcon(5),pct:16,state:'locked'}
];
function App(){ var sel=useState(0); return h('div',null,ITEMS.map(function(it,i){ return h(G.AchievementRow,{key:i,item:it,selected:sel[0]===i,onClick:function(){sel[1](i)}}); })); }
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>

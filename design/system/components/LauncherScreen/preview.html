// #fine: nothing needs the person: Conflicts is a plain pill and the rail has no caution mark.
// #noach: the hero game has no achievements a store keeps (a copy of its own), so the card shows the last game that has.
// #learning: the game playing now has no saves found yet, so learn mode is watching it (version 43).
// #update: a new version is downloaded and checked, so the top bar offers Restart to update (version 53).
var LEARNING = location.hash === '#learning', UPDATE = location.hash === '#update';
var PLAYING = location.hash === '#playing' || LEARNING, NOCLOUD = location.hash === '#nocloud', FINE = location.hash === '#fine', NOACH = location.hash === '#noach';

  var hu=hues[seed%hues.length], m=marks[seed%marks.length];

  return "data:image/svg+xml,"+encodeURIComponent(svg); }

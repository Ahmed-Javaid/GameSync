<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameSync design system · offline viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root { --v-bg:#0b0d0f; --v-panel:#111316; --v-line:#23272c; --v-ink:#eef1f4; --v-muted:#a4abb3; --v-accent:#7fe6f2; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--v-bg); color:var(--v-ink); font:14px/20px "Onest","Segoe UI",system-ui,sans-serif; }
.app { display:flex; height:100%; }
nav { width:260px; flex-shrink:0; border-right:1px solid var(--v-line); overflow:auto; padding:16px 10px; background:var(--v-panel); }
nav h1 { font-size:15px; margin:0 8px 2px; }
nav p { margin:0 8px 14px; color:var(--v-muted); font-size:12px; line-height:16px; }
nav .grp { margin:14px 8px 4px; font-weight:600; font-size:11px; line-height:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--v-muted); }
nav button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--v-muted); font:inherit; padding:6px 10px; border-radius:8px; cursor:pointer; }
nav button:hover { background:#1f2226; color:var(--v-ink); }
nav button[aria-current="page"] { background:#242b33; color:var(--v-ink); }
nav button:focus-visible, select:focus-visible { outline:2px solid var(--v-accent); outline-offset:2px; }
main { flex:1; min-width:0; overflow:auto; padding:20px 28px 40px; }
.bar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
.bar h2 { margin:0; font-size:20px; line-height:28px; }
.bar .sub { color:var(--v-muted); font-size:13px; }
select { background:#1f2226; color:var(--v-ink); border:1px solid #454b53; border-radius:8px; padding:6px 10px; font:inherit; }
.frame { border:1px solid var(--v-line); border-radius:12px; overflow:hidden; background:#101215; transform-origin:0 0; }
.frame iframe { display:block; border:0; width:100%; }
.readme { max-width:760px; margin-top:22px; color:#d6dade; }
.readme h1, .readme h2, .readme h3 { line-height:1.3; }
.readme code { font-family:"JetBrains Mono",Consolas,monospace; font-size:12.5px; background:#1f2226; padding:1px 5px; border-radius:5px; }
.readme table { border-collapse:collapse; margin:10px 0; font-size:13px; }
.readme th, .readme td { border:1px solid var(--v-line); padding:6px 8px; text-align:left; vertical-align:top; }
.readme a { color:var(--v-accent); }
</style>
</head>

<div id="nav"></div>
</nav>

<div id="stage"></div>

ero changes to another game, its picture fades to the new one; while a game runs, the hero's glow and ring in Playing's green ease in, and out when it stops.<\/li>\n<li>The rail's Game library shows the <code>play<\/code> dot while a game runs, saying which (\"Ghost of Tsushima is running\"), and the running game's tile carries Playing wherever it shows.<\/li>\n<li>The top bar's cloud button says where the saves go and whether it's reachable. When first run skipped the cloud, it's a small secondary button, Connect the cloud (<code>#nocloud<\/code>), which opens the Connect cloud dialog; until then every version stays on this PC.<\/li>\n<li>GameSync notices a game running by its programs, in the folder it's installed in, with the least access Windows gives (as Task Manager does); nothing touches the game itself. Its play is recorded, so play time and the activity calendar count it.<\/li>\n<\/ul>"},{"name":"SaveManagerScreen","group":"Screens","height":800,"width":1280,"subtitle":"Console-style save manager; a game's name opens its saves; Share and Import open their dialogs","src":"<\!-- @dsCard group=\"Screens\" height=800 width=1280 page=true subtitle=\"Console-style save manager; a game's name opens its saves; Share and Import open their dialogs\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>\nhtml,body{margin:0;background:var(--bg-100);} .pv{padding:24px;}\n.sm-main{flex:1;min-width:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--bg-400) transparent}\n.sm-top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:40px}\n.sm-crumb{display:flex;align-items:center;gap:6px;font:500 13px/20px var(--font-sans);min-width:0}\n.sm-crumb button{border:0;background:none;padding:0;color:var(--ink-muted);font:inherit;cursor:pointer}\n.sm-crumb button:hover{color:var(--ink);text-decoration:underline}\n.sm-crumb span{white ts from: game saves always; settings files (Sync between PCs, Back up on this PC, Don't back up); screenshots; Skip logs, crash dumps and caches; and patterns to skip. Changing them, or the conflict default under <strong>When two PCs disagree<\/strong>, offers to apply the change to the games already syncing, which otherwise keep their own. Cloud has three states: Google Drive, signed in as the account, with Open folder in Drive and Sign out (signed out, it offers Sign in with Google); a folder every PC points at (<code>#cloud-folder<\/code>); and no cloud yet, with Connect the cloud (<code>#cloud-none<\/code>). Devices lists every PC with its GameSync version and when it was last seen; only this PC has Rename, since each PC names itself and the others see the new name after its next sync. The foot of the settings column has the version and <strong>Copy diagnostics<\/strong>, for a bug report: the logs and each game's versions, never the sign-in or the saves. The other sections cover notifications and safety.<\/p>"},{"name":"GameDetailScreen","group":"Screens","height":800,"width":1280,"subtitle":"Game detail, beside the library's list: Back, the art, a play bar like Steam's, about the game, achievements, and a little about its saves","src":"<\!-- @dsCard group=\"Screens\" height=800 width=1280 page=true subtitle=\"Game detail, beside the library's list: Back, the art, a play bar like Steam's, about the game, achievements, and a little about its saves\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>\nhtml,body{margin:0;background:var(--bg-100);}\n.lib-pane{width:272px;flex-shrink:0;padding:12px;gap:12px;min-height:0}\n.lib-scroll{flex:1;min-height:0;overflow:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:var(--bg-400) transparent}\n.lib-content{flex:1;min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:16px;padding-right:4px;scrollbar-width:thin;scrollbar-color  left. Back returns to where you came from: the covers, Home, or the save manager; Esc, Alt+Left and the mouse's back button do the same.<\/li>\n<li><strong>The hero<\/strong> shows only the art, the eyebrow (the store; for a loose copy, its folder and engine) and the game's logo or name. Play and the facts sit under it in the <code>PlayBar<\/code>: Play; Last played, Play time, Achievements (a game whose store tracks them) and Saves (its status); then the favourite star, Properties and More (Hide from the library, Open the game's folder, Open the save folder, Properties). When the game needs you, the status's own action is the primary and Play sits beside it; a Steam game not installed here offers Install through Steam, and any other game not installed here Locate the game…. While it runs, however it was started (GameSync, a store, a shortcut) and whether its saves sync or not, the primary reads Playing and Last played reads Playing now. More adds Change the art… (Properties, on Art: its own cover, banner and logo).<\/li>\n<li><strong>About<\/strong>, from the game's Steam store page, fetched once with its art (a loose copy of a known game gets it through the save list's Steam ID): three lines of its description with Show more, then <code>Facts<\/code>: Developer, Publisher, Released, Genres, Engine; Store page opens it in the browser. A game added by hand says there's no store page.<\/li>\n<li><strong>Achievements<\/strong> (after v1): how many are unlocked, with a progress bar; the latest five with their dates; the rarest; View all lists every one, hidden ones blurred until unlocked. Only for a game whose store tracks them: a loose copy shows no card.<\/li>\n<li><strong>Saves<\/strong>, a little, so you can jump to them: the status and its sentence; when it last backed up and on which PC, how much history there is, how many named saves; the save folder with Open; and one or two actions: Back up now and New named save…; Sync these saves and Choose files… for a game not syncing yet; the status's action when it needs you. Open in Saves goes to the game's saves in the save manager.<\/li>\n<li><strong>On this PC<\/strong>: where it's installed, its size, how it starts and its launch options, with Open the folder and Properties (see Game properties). A game or folder added by hand (<code>AddGameDialog<\/code>) says how it syncs instead: when its program closes, or, with none, once its folder has been quiet for 5 minutes.<\/li>\n<li>From about 1100px wide, About and Achievements take the left column and Saves and On this PC a 316px column on the right; narrower, one column: the play bar, Saves, About, Achievements, On this PC.<\/li>\n<\/ul>"},{"name":"ConflictScreen","group":"Screens","height":800,"width":1280,"subtitle":"Conflict: both sides, a suggested choice with its reason, Compare files and Decide later; settled, Swap","src":"<\!-- @dsCard group=\"Screens\" height=800 width=1280 page=true subtitle=\"Conflict: both sides, a suggested choice with its reason, Compare files and Decide later; settled, Swap\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);} .cf-crumb{display:flex;align-items:center;gap:6px;min-width:0;font:500 13px/20px var(--font-sans)} .cf-crumb button{border:0;background:none;padding:0;color:var(--ink-muted);font:inherit;cursor:pointer;white-space:nowrap} .cf-crumb button:hover{color:var(--ink);text-decoration:underline} .cf-crumb button:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:2px}<\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n\nvar ART = \"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%201200%20500%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Crect%20width%3D%271200%27%20height%3D%27500%27%20fill%3D%27%231b2a33%27/%3E%3Ccircle%20cx%3 , from',pc:'LAPTOP',rows:[['Saved','Today 19:30'],['Session','47 min'],['Since the last sync','1 session, 47 min'],['Size','11.4 MB, 2 files'],['Changed files','S0000.sl2, S0000.sl2.bak',true]]}];\nvar FILES=[\n  {id:'f1',file:'S0000.sl2',desk:'11.4 MB · 21:04',lap:'11.4 MB · 19:30',what:'Changed on both PCs'},\n  {id:'f2',file:'S0000.sl2.bak',desk:'11.4 MB · 20:58',lap:'11.4 MB · 19:29',what:'Changed on both PCs'}];\n\nfunction Side(p){\n return h(G.Card,{className:'cf-side',style:{gap:14}},\n  h('div',{className:'gs-row',style:{justifyContent:'space-between',flexWrap:'nowrap'}},\n   h('div',null,h('div',{className:'overline gs-faint',style:{textTransform:'uppercase'}},p.where),h('div',{className:'gs-mono',style:{font:'600 20px/26px var(--font-mono)'}},p.pc)),\n   p.newest?h('span',{className:'gs-tag',style:{background:'var(--secondary-soft)',color:'var(--ink)'}},'Newest'):null),\n  h(G.Facts,{items:p.rows.map(function(r){return {label:r[0],value:r[1],mono:!!r[2]};})}),\n  // Keeping this PC's uploads it at once; keeping another PC's writes its files here, so it asks first in a small flyout.\n  SETTLED?null:h(G.Button,{variant:p.suggested?'primary':'secondary',icon:'check',style:{alignSelf:'flex-start'},'aria-haspopup':p.where==='This PC'?undefined:'dialog'},'Keep '+p.pc+'’s'));\n}\n\nfunction App(){\n var cmp=React.useState(true);\n return h(G.ThemeScope,{strength:'glass',art:ART,style:{width:1280,height:800,display:'flex'}},\n  rail('saves'),\n  h('main',{style:{flex:1,minWidth:0,padding:'20px 24px',display:'flex',flexDirection:'column',gap:16}},\n   header(),\n   h('header',{style:{display:'flex',flexDirection:'column',gap:6}},\n     h('div',null,h(G.StatusBadge,{status:'conflict',label:SETTLED?'Conflict · resolved':'Conflict · waiting for you'})),\n     h('h1',{className:'page-title',style:{margin:0}},SETTLED?'Newest kept: DESKTOP’s save':'Sekiro changed on two PCs'),\n     h('p',{className:'gs-muted',style:{margin:0,maxWidth:760}},SETTLED\n       ?'Sekiro changed on DESKTOP and on LAPTOP, and GameSync kept the newest save. LAPTOP’s is pinned in history, so nothing was lost.'\n       :'DESKTOP saved at 21:04 and LAPTOP at 19:30, both after the last sync. Both copies are safe. Pick the one to carry on with; the other stays pinned in history, and you can swap back later.')),\n   h(G.Card,{style:{padding:'12px 16px'}},h('div',{className:'gs-row',style:{flexWrap:'nowrap',gap:12}},\n     h(G.Icon,{name:'info',size:18}),\n     SETTLED\n       ?h('div',{style:{flex:1}},h('strong',{style:{fontWeight:600}},'Want LAPTOP’s instead? '),'Swap switches to it; the files there now are kept as a version first.')\n       :h('div',{style:{flex:1}},h('strong',{style:{fontWeight:600}},'Suggested: keep DESKTOP’s. '),'It’s the newest save and the longer play. You’re asked because Sekiro is set to Always ask.'),\n     SETTLED\n       ?h(G.Button,{variant:'primary',icon:'sync','aria-haspopup':'dialog'},'Swap to LAPTOP’s')\n       :h(G.Button,{size:'sm',variant:'ghost',icon:'settings'},'Change for this game'))),\n   h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}},SIDES.map(function(s){return h(Side,Object.assign({key:s.pc},s));})),\n   cmp[0]?h(G.ConsoleTable,{command:'compare sekiro --this-pc --cloud',toolbar:h('span',null,'2 files differ · settings files stay per PC'),rows:FILES,columns:[{key:'file',label:'File'},{key:'desk',label:'DESKTOP',align:'right'},{key:'lap',label:'LAPTOP',align:'right'},{key:'what',label:'What changed'}]}):null,\n   h('div',{className:'gs-row',style:{gap:12,marginTop:'auto'}},\n     h(G.Button,{variant:'secondary',icon:cmp[0]?'chevronDown':'chevronRight','aria-expanded':cmp[0],onClick:function(){cmp[1](!cmp[0])}},'Compare files'),\n     SETTLED?null:h(G.Button,{variant:'ghost',icon:'clock'},'Decide later'),\n     SETTLED?null:h('span',{className:'gs-muted',style:{fontSize:13}},'Until you decide, Sekiro won’t upload or download, and each PC keeps playing its own copy.'))));\n}\nReactDOM.createRoot(document.getElementById('root')).render(h(App));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Showcase of a conflict waiting for the person: what happened in one sentence, a suggested choice with its reason, both sides side by side, Compare files and Decide later; and, settled, which save was kept, with Swap. Built only from the components above.<\/p>\n<ul>\n<li><strong>Back<\/strong> and the breadcrumb (Save manager › the game › Conflict) at the top left: Back and Decide later return to where it was opened from (Home's Needs you, the game's page or its saves); the game's name opens its saves. Esc, Alt+Left and the mouse's back button do the same. It opens from every Resolve: the play bar, the status on a game's saves, and Home's Needs you.<\/li>\n<li>The title names the game and what happened (\"Sekiro changed on two PCs\"); the line under it says when each PC saved and that both copies are safe.<\/li>\n<li>The suggestion card says which side to keep and why (the newest save, and the longer play), and why GameSync asked instead of choosing: the game is set to Always ask, both saves came from the same starting point, or this PC's clock is off. When the newest isn't suggested, the why says so instead: it lost more than half of its files or size, or it changed while the game wasn't running. Change for this game opens its Properties, on Sync.<\/li>\n<li>Each side is a <code>Card<\/code>: where it is (This PC, or In the cloud from LAPTOP), the PC in uppercase <code>mono<\/code>, a Newest tag on <code>secondary-soft<\/code>, then <code>Facts<\/code>: when it was saved, its last session, play since the last sync, size and changed files. Another PC's session shows only when its uploads recorded one since the last sync. The suggested side's Keep button is the one <code>primary<\/code>. Keeping this PC's save uploads it at once; keeping another PC's writes its files here, so it asks first in a small flyout (\"Carry on with LAPTOP's save?\"), saying this PC's is kept in history and Swap brings it back.<\/li>\n<li>Compare files opens a <code>ConsoleTable<\/code> of the files that differ, with each side's size and time and what changed (on both PCs, on one, only on one, removed on one). Settings files aren't part of the choice: each PC keeps its own.<\/li>\n<li>Decide later leaves the game in Conflict. Until then it neither uploads nor downloads, and each PC keeps playing its own copy; the footer says so. While a choice is carried out, a line says so (\"Keeping DESKTOP's save…\") and the Keep buttons wait.<\/li>\n<li><strong>Settled<\/strong> (<code>#settled<\/code>), by newest wins or by the person: the same screen with Conflict · resolved, \"Newest kept: DESKTOP's save\" (or \"You kept DESKTOP's save\"), the sides as Current and Pinned, and one primary button, Swap to LAPTOP's, which asks first like a restore. It stays on offer while the kept save is the current one; once a newer save or a restore replaces it, the history has both. A game's saves show the same in one line under its status, with See both and Swap.<\/li>\n<\/ul>"},{"name":"PlanScreen","group":"Screens","height":800,"width":1280,"subtitle":"Plan, in the save manager: what the next sync would do for each game and why; untick to skip one","src":"<\!-- @dsCard group=\"Screens\" height=800 width=1280 page=true subtitle=\"Plan, in the save manager: what the next sync would do for each game and why; untick to skip one\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);} .pl-why{white-space:normal;display:block;padding:8px 0;max-width:640px}<\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n\nvar ART = \"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%201200%20500%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Crect%20width%3D%271200%27%20height%3D%27500%27%20fill%3D%27%231b2a33%27/%3E%3Ccircle%20cx%3D%27860%27%20cy%3D%27150%27%20r%3D%2770%27%20fill%3D%27%237fe6f2%27%20opacity%3D%27.35%27/%3E%3Cpath%20d%3D%27M0%20330%20L180%20200%20L330%20300%20L520%20150%20L700%20290%20L880%20190%20L1200%20320%20V500%20H0Z%27%20fill%3D%27%23223640%27/%3E%3Cpath%20d%3D%27M0%20400%20L220%20290%20L420%20380%20L640%20270%20L860%20370%20L1040%20300%20L1200%20360%20V500%20H0Z%27%20fill%3D%27%23182730%27/%3E%3Cpath%20d%3D%27M0%20460%20L300%20390%20L600%20450%20L900%20380%20L1200%20440%20V500%20H0Z%27%20fill%3D%27%2310191f%27/%3E%3C/svg%3E\";\n\nfunction rail(cur){return h(G.SideRail,{current:cur,items:[\n  {id:'search',icon:'search',label:'Search'},\n  {id:'home',icon:'home',label:'Home',sep:true},\n  {id:'library',icon:'library',label:'Game library',dot:'play',dotLabel:'Ghost of Tsushima is running'},\n  {id:'saves',icon:'saves',label:'Save manager',sep:true,dot:'warn',dotLabel:'1 game needs you'},\n  {id:'log',icon:'terminal',label:'Console'},\n  {id:'settings',icon:'settings',label:'Settings',bottom:true}]})}\nfunction topbar(title,sub,tabs,right){return h('header',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:16}},h('div',null,h('div',{style:{font:'600 15px/20px var(--font-sans)'}},title),h('div',{className:'gs-faint',style:{fontSize:12}},sub)),tabs,h('div',{className:'gs-row',style:{flexWrap:'nowrap'}},right));}\nfunction Stat(p){return h('div',{style:{display:'flex',flexDirection:'column',gap:2}},h('span',{className:'gs-faint',style:{font:'500 11px/14px var(--font-mono)',letterSpacing:'.08em',textTransform:'uppercase'}},p.k),h('span',{style:{font:'500 28px/32px var(--font-mono)'}},p.v))}\n\nvar ACT={upload:['upload','Upload'],download:['download','Download'],backup:['archive','Back up']};\nvar RUN=[\n  {id:'ron',name:'Ready or Not',action:'upload',why:'Changed here on 22 Sep. The upload waited because this PC was offline.',size:14155776},\n  {id:'sts2',name:'Slay the Spire 2',action:'download',why:'LAPTOP uploaded a newer save on 26 Sep and this PC’s is unchanged. This PC’s copy goes into history first.',size:913408},\n  {id:'cp',name:'Cyberpunk 2077',action:'backup',why:'Steam Cloud syncs this game, so GameSync only adds this save to its history.',size:16777216}];\nvar WAIT=[\n  {id:'sekiro',name:'Sekiro: Shadows Die Twice',status:'conflict',why:'Changed on DESKTOP and LAPTOP since the last sync. Nothing moves until you choose.',act:'Resolve'},\n  {id:'ghost',name:'Ghost of Tsushima',status:'playing',why:'Being played now. It syncs a few seconds after you quit.'},\n  {id:'rounds',name:'ROUNDS',status:'not-found',why:'No save folder found yet. Learn mode can find it during your next session.',act:'Learn mode'}];\n\nfunction why(r){return h('span',{className:'pl-why'},r.why);}\nfunction App(){\n var sel=React.useState(RUN.map(function(r){return r.id})), n=sel[0].length;\n return h(G.ThemeScope,{strength:'glass',art:ART,style:{width:1280,height:800,display:'flex'}},\n  rail('saves'),\n  h('main',{style:{flex:1,minWidth:0,padding:'20px 24px',display:'flex',flexDirection:'column',gap:16}},\n   topbar('Save manager','DESKTOP · syncs after each game, every 15 minutes, and daily at 20:00',\n     h(G.PillTabs,{label:'Save manager view',value:'plan',items:[{id:'saves',label:'Saves',icon:'saves'},{id:'plan',label:'Plan',icon:'chevronsRight'},{id:'versions',label:'Versions',icon:'clock'},{id:'log',label:'Log',icon:'terminal'}]}),\n     [h(G.Button,{key:1,variant:'secondary',icon:'sync'},'Check again'),\n      h(G.Button,{key:2,variant:'primary',icon:'chevronsRight',disabled:!n},n?'Run '+n+(n===1?' change':' changes'):'Nothing to run')]),\n   h('div',{style:{display:'flex',gap:48,padding:'4px 4px 0'}},h(Stat,{k:'Will run',v:String(n)}),h(Stat,{k:'Needs you',v:'1'}),h(Stat,{k:'Waiting',v:'2'}),h(Stat,{k:'In sync',v:'6'}),h(Stat,{k:'To move',v:G.formatBytes(RUN.filter(function(r){return sel[0].indexOf(r.id)>=0}).reduce(function(a,r){return a+r.size},0))})),\n   h(G.ConsoleTable,{command:'plan',toolbar:h('span',null,n+' of '+RUN.length+' will run · untick a game to skip it this time'),selected:sel[0],onSelect:sel[1],rows:RUN,columns:[\n     {key:'name',label:'Game'},\n     {key:'action',label:'Action',render:function(r){return h('span',{className:'gs-row',style:{gap:6,flexWrap:'nowrap'}},h(G.Icon,{name:ACT[r.action][0],size:14}),ACT[r.action][1]);}},\n     {key:'why',label:'Why',render:why},\n     {key:'size',label:'Size',align:'right',render:function(r){return G.formatBytes(r.size)}}]}),\n   h(G.ConsoleTable,{command:'plan --not-running',toolbar:h('span',null,'3 games won’t run this time'),rows:WAIT,columns:[\n     {key:'name',label:'Game'},\n     {key:'status',label:'Status'},\n     {key:'why',label:'Why',render:why},\n     {key:'act',label:'',align:'right',render:function(r){return r.act?h(G.Button,{size:'sm',variant:'secondary'},r.act):null}}]}),\n   h('div',{className:'gs-row',style:{justifyContent:'space-between',marginTop:'auto'}},\n     h(G.Button,{size:'sm',variant:'ghost',icon:'chevronRight'},'Show the 6 games already in sync'),\n     h('span',{className:'gs-faint',style:{fontSize:12}},'Nothing changes until you run it. The daily backup and the sync after each game follow the same rules.'))));\n}\nReactDOM.createRoot(document.getElementById('root')).render(h(App));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Showcase of the Plan view in the save manager: what the next sync would do for each game and why, without doing anything until you run it. Built only from the components above.<\/p>\n<ul>\n<li>Plan is a tab of the save manager (Saves, Plan, Versions, Log). Its top bar swaps Sync now for <strong>Run N changes<\/strong> (primary, counting the ticked games) and Check again (secondary).<\/li>\n<li>The stat strip counts what will run, what needs you, what waits and what's already in sync, plus how much will move.<\/li>\n<li>The first <code>ConsoleTable<\/code> lists the changes: game, action (Upload, Download, Back up, each with its icon), why in one plain sentence, and size. Every row starts ticked; unticking one skips that game this time only.<\/li>\n<li>The second lists games that won't run and why: needs you, being played, saves not found, drive not connected. Each keeps its status's button (Resolve, Learn mode, Add a place); it can't be ticked.<\/li>\n<li>Games already in sync stay folded away behind one ghost button.<\/li>\n<li>Running does exactly what the plan showed, and the log records it line by line.<\/li>\n<\/ul>"},{"name":"OnboardingScreen","group":"Screens","height":800,"width":1280,"subtitle":"First run: scan this PC, choose games, connect the cloud, backups and startup; click a step","src":"<\!-- @dsCard group=\"Screens\" height=800 width=1280 page=true subtitle=\"First run: scan this PC, choose games, connect the cloud, backups and startup; click a step\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);} .ob-row{display:grid;grid-template-columns:18px 24px 196px minmax(0,1fr) 84px;gap:12px;align-items:center;min-height:36px} .ob-cut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}<\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n\nvar ART = \"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%201200%20500%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Crect%20width%3D%271200%27%20height%3D%27500%27%20fill%3D%27%231b2a33%27/%3E%3Ccircle%20cx%3D%27860%27%20cy%3D%27150%27%20r%3D%2770%27%20fill%3D%27%237fe6f2%27%20opacity%3D%27.35%27/%3E%3Cpath%20d%3D%27M0%20330%20L180%20200%20L330%20300%20L520%20150%20L700%20290%20L880%20190%20L1200%20320%20V500%20H0Z%27%20fill%3D%27%23223640%27/%3E%3Cpath%20d%3D%27M0%20400%20L220%20290%20L420%20380%20L640%20270%20L860%20370%20L1040%20300%20L1200%20360%20V500%20H0Z%27%20fill%3D%27%23182730%27/% ts files in a GameSync folder inside it.'},h(G.StatusBadge,{status:'synced',label:'Ready'}),h(G.Button,{size:'sm',variant:'ghost',onClick:function(){folder[1](null)}},'Change\\u2026'))\n      :h(G.SettingsRow,{title:'Use a folder instead',description:'A NAS, a USB drive or another disk. Every PC points at the same folder.'},h(G.Button,{variant:'secondary',icon:'folder',onClick:function(){folder[1]('D:\\\\GameSync')}},'Choose a folder'))),\n    h('div',{className:'gs-note'},h(G.Icon,{name:'monitor',size:16}),'Setting up the laptop later? Install GameSync there and sign in with the same Google account; it finds this PC\\u2019s saves.'),\n    connected?null:h('div',{className:'gs-note'},h(G.Icon,{name:'info',size:16}),'Skip for now keeps every version on this PC. Connect the cloud, on Home\\u2019s top bar, connects one whenever you like, and what waited goes up then.'),\n    h(Foot,{back:function(){go('choose')},next:function(){go('daily')},label:connected?'Continue':'Skip for now',quiet:!connected}));},\n  daily:function(){return h(Page,{title:'Backups and startup',sub:'Games sync when you quit them. These two keep that going without you.'},\n    h(G.Card,null,\n     h(G.SettingsRow,{title:'Start GameSync when you sign in',description:'It notices games however you start them, syncs each one after you play, and brings the other PC\\u2019s saves down.'},h(G.Switch,{label:'Start GameSync when you sign in',checked:startup[0],onChange:startup[1]})),\n     h(G.SettingsRow,{title:'Back up every day at 20:00',description:'Pick a time your PC is usually on. If it\\u2019s off then, the backup runs about 10 minutes after you next sign in.'},\n      timeOpen[0]?h('span',{className:'gs-row',style:{flexWrap:'nowrap',gap:8}},h('input',{className:'gs-input',style:{width:84,textAlign:'center'},defaultValue:'20:00','aria-label':'Daily backup time, 24-hour'}),h(G.Button,{size:'sm',variant:'primary',onClick:function(){timeOpen[1](false)}},'Save'))\n       :h(G.Button,{size:'sm',variant:'secondary',icon:'clock',disabled:!daily[0],onClick:function(){timeOpen[1](true)}},'Change time'),\n      h(G.Switch,{label:'Back up every day',checked:daily[0],onChange:daily[1]}))),\n    h('div',{className:'gs-note'},h(G.Icon,{name:'shield',size:16}),'Both run as you, without admin rights, so Windows won\\u2019t ask for permission. You can change them in Settings.'),\n    h(G.Card,{title:'Ready',subtitle:'22 games sync and 14 are backed up. Your saves stay in their folders; GameSync keeps copies.'},\n     h('div',{className:'gs-note'},h(G.Icon,{name:'upload',size:16}),'The first backup, about 1.1 GB, runs in the background once you start. You can play meanwhile.')),\n    h(Foot,{back:function(){go('cloud')},next:function(){},label:'Start using GameSync',done:true}));}\n };\n return h(G.ThemeScope,{strength:'glow',art:ART,style:{width:1280,height:800,display:'flex',position:'relative'}},\n  h('aside',{style:{width:280,flexShrink:0,padding:'28px 16px 24px',display:'flex',flexDirection:'column',gap:24,background:'var(--bg-100)',borderRight:'1px solid var(--line-100)'}},\n   h('div',{className:'gs-row',style:{gap:12,padding:'0 12px',flexWrap:'nowrap'}},h(G.Icon,{name:'logo',size:28}),h('div',null,h('div',{style:{font:'600 15px/20px var(--font-sans)'}},'Set up GameSync'),h('div',{className:'gs-faint',style:{fontSize:12}},'Four steps, about two minutes'))),\n   h(G.SettingsNav,{label:'Setup steps',current:step,onChange:go,items:STEPS.map(function(s,i){return {id:s.id,label:s.label,icon:i<idx?'check':s.icon};})}),\n   h('div',{className:'gs-note',style:{marginTop:'auto',padding:'0 12px'}},h(G.Icon,{name:'info',size:16}),'Nothing syncs until you finish, and your saves stay where they are.')),\n  h('main',{style:{flex:1,minWidth:0,padding:'28px 32px 24px',display:'flex',flexDirection:'column'}},views[step]()),\n  adding[0]?h('div',{className:'gs-scrim',style:{position:'absolute',inset:0,zIndex:5}},h(G.AddGameDialog,{setup:true,name:'Minecraft server world',\n   folder:{path:'D:\\\\Servers\\\\Minecraft\\\\world',files:142,bytes:40265318,newest:'today 20:55',programs:0},\n   onClose:function(){adding[1](false)},onAdd:function(){adding[1](false)}})):null);\n}\nReactDOM.createRoot(document.getElementById('root')).render(h(App));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Showcase of first-run setup in four steps: scan this PC, choose games, connect the cloud, backups and startup. Built only from the components above; the steps on the left are a <code>SettingsNav<\/code>, and finished steps take the <code>check<\/code> icon.<\/p>\n<ul>\n<li>There's no side rail until setup is done. Each step has one primary button, the one that moves on; Back is <code>ghost<\/code>. Nothing syncs until the last step, and the left column says so.<\/li>\n<li><strong>Scan this PC<\/strong> starts when the step opens and says how far it has got (<code>#scanning<\/code>: each game's saves, one by one, about a minute on a big library); Choose games waits for it. It shows what each store holds and the game folders scanned, as a <code>FolderList<\/code>; Add a game folder picks one in Windows' folder picker and scans again. The scan only reads.<\/li>\n<li><strong>Choose games<\/strong> takes the full width and groups what was found, each group a <code>Card<\/code> with a checkbox for the whole group: Sync (open, one row per game with its cover, name, save path in <code>mono<\/code> and how it was found: save list, engine rule or name search), Synced by their store (Steam or Epic syncs them between PCs; GameSync keeps a backup of every version), Probably online-only (unticked), Saves found but game not installed, and No saves found yet (a clock icon instead of a checkbox: those games are watched the first time they're played). Last comes Something missing?, whose Add a game or folder opens the same dialog as the library's Add game (<code>AddGameDialog<\/code>, <code>#add-game<\/code>), with Add in place of Add and sync: what's added joins Sync, ticked. The anti-cheat note names those games beside Back and Continue. Bringing over Ludusavi stays on the command line.<\/li>\n<li>In Glossy it takes the glow strength over the last-played game's art, like Settings.<\/li>\n<li><strong>Connect the cloud<\/strong>: Sign in with Google is the primary until you're signed in (<code>#cloud-signed<\/code>), and Skip for now is <code>secondary<\/code>; once signed in, or with a folder chosen, Continue takes over. A folder (NAS, USB drive, another disk) is the alternative: chosen, it reads \"Saves go to D:\\GameSync\" with Ready and Change… (<code>#cloud-folder<\/code>). Skip for now keeps every version on this PC; until a cloud is connected, Home's top bar has Connect the cloud in place of the cloud button (see Connect cloud dialog). The laptop joins later by signing in with the same account.<\/li>\n<li><strong>Backups and startup<\/strong>: start GameSync at sign-in and the daily backup time, both on by default. Change time opens a small time field in place, in 24-hour time, with Save (<code>#daily-time<\/code>). Say that both run as the person, without admin rights, so Windows won't ask for permission. The last button, Start using GameSync, opens the launcher while the first backup runs in the background.<\/li>\n<\/ul>"},{"name":"LibraryScreen","group":"Screens","height":800,"width":1280,"subtitle":"Game library: the list with search, sort and favourites beside the covers; a game's page opens beside the list","src":"<\!-- @dsCard group=\"Screens\" height=800 width=1280 page=true subtitle=\"Game library: the list with search, sort and favourites beside the covers; a game's page opens beside the list\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>\nhtml,body{margin:0;background:var(--bg-100);}\n.lib-pane{width:272px;flex-shrink:0;padding:12px;gap:12px;min-height:0}\n.lib-scroll{flex:1;min-height:0;overflow:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin;scrollbar-color:var ary':'Hide from the library'},{id:'art',label:'Change the art\\u2026',icon:'palette'}].concat(g.installed===false?[]:[{id:'folder',label:'Open the game\\u2019s folder',icon:'folder'}],\n          [{id:'saves-folder',label:'Open the save folder',icon:'saves'},{sep:true},{id:'props',label:'Properties',icon:'settings'}])\n      : (g.installed===false ? [] : [{id:'play',label:'Play',icon:'play'},{sep:true}]).concat([\n         {id:'fav',label:g.fav?'Remove from favourites':'Add to favourites',icon:'star',filled:!!g.fav},\n         {id:'hide',label:g.hidden?'Show in the library':'Hide from the library'},{sep:true},{id:'props',label:'Properties',icon:'settings'}]);\n    menuEl = h('div',{onClick:function(e){e.stopPropagation()},style:{position:'absolute',left:m.x,top:m.y,zIndex:20}},\n      h(G.Menu,{label:m.kind==='sort'?'Sort by':g.name,items:items,onPick:function(id){\n        if(m.kind==='sort') sort[1](id);\n        else if(id==='fav') update(g,{fav:!g.fav});\n        else if(id==='hide') update(g,{hidden:!g.hidden});\n        else if(id==='props'){ sel[1](g.id); props[1]({section:'general'}); }\n        else if(id==='art'){ sel[1](g.id); props[1]({section:'art'}); }\n        menu[1](null);}}));\n  }\n  return h('div',{ref:frame,style:{position:'relative',width:1280,height:800}},\n    h(G.ThemeScope,{strength:'glass',art:current&&current.hero?current.hero:HERO_AMBER,style:{width:1280,height:800,display:'flex'}},\n      rail('library',function(id){ if(id==='search'&&search.current) search.current.focus(); }),\n      h('main',{style:{flex:1,minWidth:0,padding:'20px 24px',display:'flex',gap:16}},\n        h('aside',{className:'gs-card lib-pane','aria-label':'Your games'},\n          h(G.SearchField,{value:q[0],onChange:q[1],placeholder:'Search your games',hint:'Ctrl F',inputRef:search,onSubmit:function(){ if(shown[0]) sel[1](shown[0].id); }}),\n          h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}},\n            h('span',{className:'gs-faint',style:{fontSize:12}},q[0]?shown.length+' of '+inView.length+' games':inView.length+' games'),\n            h(G.Button,{size:'sm',variant:'ghost',icon:'sort',iconAfter:'chevronDown','aria-haspopup':'menu','aria-label':'Sort by: '+SORTS.filter(function(s){return s.id===sort[0]})[0].label,\n              onClick:function(e){openMenu('sort',null,e)}},SORTS.filter(function(s){return s.id===sort[0]})[0].label)),\n          h('div',{className:'lib-scroll'},h(G.GameList,{groups:groups,selected:sel[0],onSelect:sel[1],onMenu:function(g,e){openMenu('row',g,e)},\n            empty:'No game matches \\u201c'+q[0]+'\\u201d.'}))),\n        h('section',{className:'lib-content','aria-label':current?current.name:'My games'},\n          current ? h(GamePage,{key:current.id,game:current,onBack:back,onFav:function(g){update(g,{fav:!g.fav})},onMore:function(g,e){openMenu('more',g,e)},\n              onProps:function(section){props[1]({section:section})},onSaves:function(){}})\n          : h(Covers,{games:shown,tab:tab[0],onTab:tab[1],query:q[0],onOpen:sel[1],onMenu:function(g,e){openMenu('tile',g,e)}})))),\n    menuEl,\n    props[0] && current ? h('div',{className:'gs-scrim',style:{position:'absolute',inset:0,zIndex:30},onClick:function(){props[1](null)}},\n      h('div',{onClick:function(e){e.stopPropagation()}},h(G.GamePropertiesDialog,{key:current.id+props[0].section,game:propsOf(current),section:props[0].section,\n        onClose:function(){props[1](null)},onSave:function(v){update(current,{name:v.name,fav:v.favourite,hidden:!v.shown});props[1](null)}}))) : null);\n}\nReactDOM.createRoot(document.getElementById('root')).render(h(App));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Showcase of the game library, laid out like Steam's: every game by name in a list on the left, and the covers, or the page of the game picked, on the right. Built only from the components above; try the search, the sort, a right-click and a click on a game.<\/p>\n<ul>\n<li><strong>The list<\/strong> (<code>GameList<\/code> in a 272px <code>Card<\/code> that runs the page's height): <code>SearchField<\/code> at the top (\"Search your games\"; Ctrl+F anywhere in the library, or the rail's Search, puts the cursor there; Esc clears it; Enter opens the first match); under it how many games the view holds and the sort, a small ghost button naming the order (\"Recently played\") that opens a <code>Menu<\/code>: Recently played, Name, Hours played, Recently added. Then <strong>Favourites<\/strong>, then the view's other games, both in that order. Up and Down move through the list, Enter opens the game.<\/li>\n<li><strong>A row<\/strong> is the game's small cover and its name, with the status under the name only when the game needs you or is running; games not installed on this PC are dimmed. A click opens the game's page; a right-click (or the Menu key) opens Play, Add to favourites (or Remove), Hide from the library and Properties.<\/li>\n<li><strong>The covers<\/strong>: the top bar with My games and a count, <code>PillTabs<\/code> for the view (All games; Installed, only what's installed on this PC; Local, games in their own folders started without a store's launcher; Needs you with its count; and Software and Hidden when there are any) and Add game, which opens Add a game or folder (<code>AddGameDialog<\/code>): a game GameSync didn't find, or a folder such as a game server's world, synced like a game. The view is kept per PC, so a library shown Installed opens Installed next time. Local says what it holds and offers Scan a folder for games…, which picks a folder (G:\\, E:\\Games) for GameSync to look in, now and at every scan; the games found there get Play. The view's games as <code>GameTile<\/code>s, favourites first under a FAVOURITES <code>overline<\/code> and the rest under ALL GAMES, in the list's order, as many to a row as fit at 150px or wider. The tab and the search apply to both sides; with nothing matching, the covers say so.<\/li>\n<li><strong>A game's page<\/strong> takes the covers' place and the list stays, so the next game is one click away. Its Back button, the breadcrumb's My games, Esc, Alt+Left and the mouse's back button return to the covers as they were, or to the page that opened it (Home); reached from the rail's Game library, the page still open leads Back to the covers. Its More menu adds Change the art… (its Properties, on Art). A game found only by its saves, and from no store, offers Locate the game…: its program, picked in Windows' picker, marks it installed here, and Play starts it from there. See Game detail.<\/li>\n<li><strong>Favourites<\/strong> are kept per PC, like hidden games: the star on a game's page or its right-click menu adds and removes one.<\/li>\n<li>The page is full glass, as Game detail is, so the list and the covers' page keep the art's colour as pages open and close (the owner, 1 Oct 2026); with a game's page open, it takes that game's art.<\/li>\n<\/ul>"},{"name":"GameSavesScreen","group":"Screens","height":800,"width":1280,"subtitle":"One game's saves in the save manager: status, named saves, where the saves are, every version with Restore, its log; #bloodborne, a game not syncing yet whose live save sits beside copies kept by hand","src":"<\!-- @dsCard group=\"Screens\" height=800 width=1280 page=true subtitle=\"One game's saves in the save manager: status, named saves, where the saves are, every version with Restore, its log; #bloodborne, a game not syncing yet whose live save sits beside copies kept by hand\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>\nhtml,body{margin:0;background:var(--bg-100);} .pv{padding:24px;}\n.sm-main{flex:1;min-width:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--bg-400) transparent}\n.sm-top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:40px}\n.sm-crumb{display:f <strong>Status<\/strong>: the game's one status, what happened in a sentence, and its actions when it needs you: Keep the new save (primary) and Restore the previous save for a held save, Resolve for a conflict (its screen: ConflictScreen), Retry when a file was in use, Add a place… when its saves weren't found. The last conflict GameSync settled shows in a line under it while its winner is the current save (\"Newest kept: DESKTOP's save is current, LAPTOP's is pinned in history.\"), with See both (the conflict screen, settled) and Swap to LAPTOP's, which asks first like a restore (<code>#terraria<\/code> shows it).<\/li>\n<li><strong>Named saves<\/strong>, newest first, each with Restore and ⋯: Rename (a box with its name, Enter or Rename) and Remove the name (the save stays in the history, where it comes back like any version). The card's own New named save… keeps this save under a name (a box for the name, Enter or Save); None yet says what it's for. On a game not syncing yet, it and Import kept saves… say first that GameSync starts keeping its saves, backed up but not synced between PCs, with the files and size it starts with.<\/li>\n<li><strong>Where the saves are<\/strong>: each place as this PC has it, in <code>mono<\/code>, with its files, size and newest date, Open the folder and Choose files…; Add a place… sets one by hand (AddPlaceDialog, FOLD-01).<\/li>\n<li><strong>History<\/strong>: every version from every PC (<code>ConsoleTable<\/code>): when, which PC, a note (Current; a pin and the label for named, before-update and conflict versions), the size, and Restore (it asks first, and keeps the files there now as a version) and Export. The game's log (<code>ConsoleLog<\/code>) under it.<\/li>\n<li><strong>A game not syncing yet<\/strong> (<code>#bloodborne<\/code>): its status is Not syncing yet, with what the scan found and Sync these saves as the primary; Import kept saves…, Back up now and New named save… keep it backed up only (KAN-63). When its live save sits beside copies kept by hand (Bloodborne's \"Before Orphan\\SPRJ0005\" beside \"SPRJ0005\", KAN-61), Where the saves are shows the live save alone, and under it the copies beside it, with how many, where and how big, and Bring them in…; Sync these saves opens KeptCopiesDialog (<code>#bloodborne-sync<\/code>), which syncs only the live save and brings the copies in as named saves in one step (<code>#bloodborne-backup<\/code> is the same from Back up now). Choose files… and Add a place… wait until its saves sync. With no versions yet, the history says so.<\/li>\n<\/ul>"},{"name":"LogScreen","group":"Screens","height":800,"width":1280,"subtitle":"Log: everything GameSync did, per game, newest first; search it or show only what needs you","src":"<\!-- @dsCard group=\"Screens\" height=800 width=1280 page=true subtitle=\"Log: everything GameSync did, per game, newest first; search it or show only what needs you\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);}<\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n\nvar ART = \"\";\n\nfunction rail(cur){return h(G.SideRail,{current:cur,items:[\n  {id:'search',icon:'search',label:'Search'},\n  {id:'home',icon:'home',label:'Home',sep:true},\n  {id:'library',icon:'library',label:'Game library'},\n  {id:'saves',icon:'saves',label:'Save manager',sep:true,dot:'warn',dotLabel:'2 games need you'},\n  {id:'log',icon:'terminal',label:'Console'},\n  {id:'settings',icon:'settings',label:'Settings',bottom:true}]})}\nfunction topbar(title,sub,tabs,right){return h('header',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:16}},h('div',null,h('div',{style:{font:'600 15px/20px var(--font-sans)'}},title),h('div',{className:'gs-faint',style:{fontSize:12}},sub)),tabs,h('div',{className:'gs-row',style:{flexWrap:'nowrap'}},right));} t needs you'},{id:'moves',label:'Uploads, downloads and restores'}];\nvar MOVES=['upload','download','backup','restore','named'];\n\n// #needs: only what needs you; #search: the search typed.\nvar STATE=location.hash.slice(1);\nfunction App(){\n var q=React.useState(STATE==='search'?'dark souls':''), game=React.useState('all'), show=React.useState(STATE==='needs'?'needs':'all');\n var words=q[0].toLowerCase();\n var lines=LINES.filter(function(l){return (game[0]==='all'||l.game===game[0])\n   &&(show[0]==='all'||(show[0]==='needs'?l.level==='warn'||l.level==='error':MOVES.indexOf(l.tag)>=0))\n   &&(!words||l.msg.toLowerCase().indexOf(words)>=0)});\n return h(G.ThemeScope,{strength:'glass',art:ART,style:{width:1280,height:800,display:'flex'}},\n  rail('saves'),\n  h('main',{style:{flex:1,minWidth:0,padding:'20px 24px',display:'flex',flexDirection:'column',gap:16}},\n   topbar('Save manager','Everything GameSync did, per game, newest first',\n     h(G.PillTabs,{label:'Save manager view',value:'log',items:TABS}),\n     [h(G.Button,{key:'c',variant:'secondary',icon:'copy'},'Copy the log')]),\n   h('div',{className:'gs-row',style:{flexWrap:'nowrap',gap:12}},\n     h(G.SearchField,{placeholder:'Search the log',value:q[0],onChange:q[1],style:{width:320}}),\n     h(G.Select,{label:'Game',value:game[0],options:GAMES,onChange:game[1]}),\n     h(G.Select,{label:'Show',value:show[0],options:SHOW,onChange:show[1]}),\n     h('span',{className:'gs-faint',style:{marginLeft:'auto',fontSize:12}},lines.length+' of 1,284 lines')),\n   lines.length?h(G.ConsoleLog,{lines:lines.map(function(l){return {time:l.time,level:l.level,tag:l.tag,msg:l.msg}}),grow:true,dated:true,label:'GameSync’s log'})\n     :h('div',{className:'gs-note'},h(G.Icon,{name:'search',size:16}),'Nothing in the log matches. Try fewer words, or Everything.'),\n   h('span',{className:'gs-faint',style:{fontSize:12}},'Every line is kept. Copy the log puts the lines shown on the clipboard, for a bug report: never sign-in tokens or save files.')));\n}\nReactDOM.createRoot(document.getElementById('root')).render(h(App));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Showcase of the Log tab of the save manager: everything GameSync did, per game, newest first, kept for good, so a problem can be traced to the game and the moment it happened. Built only from the components above.<\/p>\n<ul>\n<li>It's a tab of the save manager (Saves, Plan, Versions, Log). The Saves tab keeps its short live log at the bottom; this is the whole of it. The rail's Console is the agent's own output as it happens, for the curious; this is the record.<\/li>\n<li>Above the log: a <code>SearchField<\/code> (\"Search the log\"; matching as the library's search does), a <code>Select<\/code> for the game, and a <code>Select<\/code> for what to show: Everything, Only what needs you (warnings and errors), or Uploads, downloads and restores. On the right, how many lines match of how many there are.<\/li>\n<li>One <code>ConsoleLog<\/code> filling the rest: when (a day and the time to the second), the tag (upload, download, backup, restore, named, conflict, held, in use, session, daily), and the line, in the same plain, per-game voice as the rest of the app. Errors get their <code>danger-soft<\/code> row, warnings their <code>warn<\/code> tag.<\/li>\n<li>Nothing matching says so where the lines would be (<code>#search<\/code> with a search that finds nothing, say), and how to widen it.<\/li>\n<li>Copy the log, in the top bar, puts the lines shown on the clipboard for a bug report, never sign-in tokens or save files (SET-05's rule).<\/li>\n<\/ul>"},{"name":"VersionsScreen","group":"Screens","height":800,"width":1280,"subtitle":"Versions: every version of every game, newest first, from every PC; filter by game or PC","src":"<\!-- @dsCard group=\"Screens\" height=800 width=1280 page=true subtitle=\"Versions: every version of every game, newest first, from every PC; filter by game or PC\" -->\n<!doctype html>\n<html lang=\"en\ 2},\n  {id:'3',saved:'Today 20:00',game:'Terraria',pc:'DESKTOP',what:'Daily backup',kind:'daily',files:3,size:341835776},\n  {id:'4',saved:'Today 19:30',game:'Slay the Spire 2',pc:'LAPTOP',what:'After play · 47 min',kind:'play',files:1,size:913408},\n  {id:'5',saved:'Yesterday 23:31',game:'Black Myth: Wukong',pc:'DESKTOP',what:'Named: Before Erlang Shen',kind:'kept',files:3,size:522240},\n  {id:'6',saved:'Yesterday 22:47',game:'Black Myth: Wukong',pc:'DESKTOP',what:'Changed outside play, held for review',kind:'held',files:3,size:519168},\n  {id:'7',saved:'Yesterday 21:10',game:'Minecraft server world',pc:'DESKTOP',what:'After 5 quiet minutes',kind:'quiet',files:142,size:40265318},\n  {id:'8',saved:'27 Sep 18:05',game:'Hollow Knight',pc:'LAPTOP',what:'Kept before the update to 1.5.78',kind:'kept',files:6,size:1153434},\n  {id:'9',saved:'27 Sep 12:00',game:'Dark Souls III',pc:'DESKTOP',what:'Kept before a restore',kind:'kept',files:1,size:6815744},\n  {id:'10',saved:'25 Sep 20:00',game:'Cuphead',pc:'LAPTOP',what:'First backup',kind:'first',files:4,size:48128}];\nvar GAMES=[{id:'all',label:'All games'}].concat(ROWS.map(function(r){return r.game}).filter(function(g,i,a){return a.indexOf(g)===i}).sort().map(function(g){return {id:g,label:g}}));\n\n// #kept: only named and pinned versions; #empty: a filter nothing matches.\nvar STATE=location.hash.slice(1);\nfunction App(){\n var game=React.useState(STATE==='empty'?'Hades':'all'), pc=React.useState('all'), kept=React.useState(STATE==='kept');\n var rows=ROWS.filter(function(r){return (game[0]==='all'||r.game===game[0])&&(pc[0]==='all'||r.pc===pc[0])&&(!kept[0]||r.kind==='kept')});\n return h(G.ThemeScope,{strength:'glass',art:ART,style:{width:1280,height:800,display:'flex'}},\n  rail('saves'),\n  h('main',{style:{flex:1,minWidth:0,padding:'20px 24px',display:'flex',flexDirection:'column',gap:16}},\n   topbar('Save manager','DESKTOP · 214 versions of 12 games, from DESKTOP and LAPTOP',\n     h(G.PillTabs,{label:'Save manager view',value:'versions',items:TABS}),\n     [h(G.Select,{key:'g',label:'Game',value:game[0],options:STATE==='empty'?GAMES.concat([{id:'Hades',label:'Hades'}]):GAMES,onChange:game[1]}),\n      h(G.Select,{key:'p',label:'PC',value:pc[0],options:[{id:'all',label:'Every PC'},{id:'DESKTOP',label:'DESKTOP'},{id:'LAPTOP',label:'LAPTOP'}],onChange:pc[1]})]),\n   h('div',{style:{display:'flex',gap:48,padding:'4px 4px 0'}},h(Stat,{k:'Versions',v:'214'}),h(Stat,{k:'Named',v:'5'}),h(Stat,{k:'Kept',v:'12'}),h(Stat,{k:'This week',v:'31'}),h(Stat,{k:'Oldest',v:'14 Sep'})),\n   h(G.ConsoleTable,{command:'versions --all',toolbar:h(G.Checkbox,{label:'Named and kept only',showLabel:true,checked:kept[0],onChange:kept[1]}),\n     onRowClick:function(){},rows:rows,empty:'No version of Hades yet: it hasn’t synced since it was added.',columns:[\n     {key:'saved',label:'Saved'},\n     {key:'game',label:'Game'},\n     {key:'pc',label:'PC'},\n     {key:'what',label:'Why it was kept',render:function(r){return h('span',{className:'gs-row',style:{gap:6,flexWrap:'nowrap'}},h(G.Icon,{name:KIND[r.kind],size:14}),r.what);}},\n     {key:'files',label:'Files',align:'right'},\n     {key:'size',label:'Size',align:'right',render:function(r){return G.formatBytes(r.size)}}]}),\n   h('div',{className:'gs-row',style:{justifyContent:'space-between',marginTop:'auto'}},\n     h(G.Button,{size:'sm',variant:'ghost',icon:'chevronDown'},'Show 204 older'),\n     h('span',{className:'gs-faint',style:{fontSize:12}},'A row opens its game’s saves, where Restore is. Every version is kept: all of them in the cloud, and the last 10 of each game on this PC.'))));\n}\nReactDOM.createRoot(document.getElementById('root')).render(h(App));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Showcase of the Versions tab of the save manager: every version of every game, newest first, from every PC, so what GameSync kept lately, and why, is one look away. Built only from the components above.<\/p>\n<ul>\n<li>It's a tab of the save manager (Saves, Plan, Versions, Log). The top bar's right side holds two <code>Select<\/code>s: the game (All games, then each game by name) and the PC (Every PC, then each PC by name).<\/li>\n<li>The stat strip counts every version kept, how many are named, how many are kept (pinned: named saves, the save that lost a conflict, the save before an update or a restore), how many were made this week, and the oldest.<\/li>\n<li>One <code>ConsoleTable<\/code>, newest first: when it was saved, the game, the PC in <code>mono<\/code> capitals, why it was kept with its icon (after play and how long, after 5 quiet minutes for a folder of your own, the daily backup, the first backup, held for review, named, or kept before an update, a restore or after losing a conflict), how many files and its size. Named and kept only, in the toolbar, narrows it to the versions that stay pinned.<\/li>\n<li>A row opens that game's saves with the version picked, where Restore is and asks first: this tab only finds a version; it never restores one itself.<\/li>\n<li>The newest 100 show; Show N older loads the rest. With a filter that matches nothing, the table says why (<code>#empty<\/code>).<\/li>\n<li>The foot says every version is kept: all of them in the cloud, and the last 10 of each game on this PC (or all of them, as Settings keeps them).<\/li>\n<\/ul>"},{"name":"ActivityGrid","group":"Launcher","height":360,"width":null,"subtitle":"","src":"<\!-- @dsCard group=\"Launcher\" height=360 -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);} .pv{padding:24px;} <\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\" class=\"pv\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n\nvar ART = \"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%201200%20500%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Crect%20width%3D%271200%2 <code>groups<\/code> (<code>{id, label, games, collapsed?}<\/code>: Favourites first, then the view's other games), <code>selected<\/code> (the game whose page is open), <code>onSelect<\/code> and <code>onMenu<\/code> (a right-click). A game is <code>{id, name, art, status, statusLabel, installed}<\/code>.<\/p>\n<ul>\n<li>A row is 36px: the small cover (Steam's 300×450 capsule, 20×30 on <code>radius-sm<\/code>; just the letter on <code>bg-300<\/code> when there's no art) and the name in <code>body-strong<\/code> at 13px. The open game's row fills with <code>secondary-soft<\/code>; hover is <code>bg-300<\/code>.<\/li>\n<li>The status shows under the name, as a plain <code>StatusBadge<\/code>, only when the game needs you (Conflict, Held for review, Files in use, Saves not found, Blocked) or is Playing. Synced, Synced by Steam and the rest stay on the tile and the game's page, so the list stays quiet and what needs you stands out.<\/li>\n<li>A game not installed on this PC is dimmed: its name in <code>ink-faint<\/code>, its cover at 55%. Its screen-reader name says \"not installed on this PC\".<\/li>\n<li>Group headings are <code>overline<\/code> with the count in <code>mono<\/code>; a click opens or closes the group. Empty groups aren't shown.<\/li>\n<\/ul>"},{"name":"SearchField","group":"Launcher","height":200,"src":"<\!-- @dsCard group=\"Launcher\" height=200 -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);} .pv{padding:24px;} <\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\" class=\"pv\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n\nvar ART = \"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%201200%20500%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Crect%20width%3D%271200%27%20height%3D%27500%27%20fill%3D%27%231b2a33%27/%3E%3Ccircle%20cx%3D%27860%27%20cy%3D%27150%27%20r%3D%  Properties: General, Art, Launch, Installed files, Saves (which files are backed up), Sync\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);} .pv{padding:24px;} <\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n\nvar GAME={id:'ror2',name:'Risk of Rain 2',favourite:true,installed:true,store:'Steam',storeId:'632360',installDir:'E:\\\\Steam\\\\steamapps\\\\common\\\\Risk of Rain 2',size:'1.8 GB',build:'15632211',engine:'Unity',foundBy:'Steam\\u2019s library, 28 Sep',\n  launch:{url:'steam://rungameid/632360',steamOptions:'-novid'},settings:'this-pc',screenshots:'off',skip:true,mode:'sync',conflict:'newest',\n  // Steam's cover and banner, and a banner of the person's own, which wins.\n  art:{cover:\"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20200%20300%27%3E%3Crect%20width%3D%27200%27%20height%3D%27300%27%20fill%3D%27%231d2630%27/%3E%3Ccircle%20cx%3D%27140%27%20cy%3D%2790%27%20r%3D%2738%27%20fill%3D%27%237fe6f2%27%20opacity%3D%27.5%27/%3E%3C/svg%3E\",\n    hero:\"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%201200%20400%27%3E%3Crect%20width%3D%271200%27%20height%3D%27400%27%20fill%3D%27%231b2a33%27/%3E%3Cpath%20d%3D%27M0%20300%20L300%20180%20L600%20280%20L900%20160%20L1200%20260%20V400%20H0Z%27%20fill%3D%27%23223640%27/%3E%3C/svg%3E\",\n    mine:{hero:\"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%201200%20400%27%3E%3Crect%20width%3D%271200%27%20height%3D%27400%27%20fill%3D%27%232c2519%27/%3E%3Ccircle%20cx%3D%27900%27%20cy%3D%27140%27%20r%3D%2790%27%20fill%3D%27%23f2b544%27%20opacity%3D%27.45%27/%3E%3C/svg%3E\"}},\n  files:[\n    {id:'p1',name:'E:\\\\Steam\\\\userdata\\\\41755\\\\632360\\\\remote\\\\UserProfiles',kind:'folder',checked:true,mixed:true,open:true,meta:'4 files',children:[\n      {id:'a',name:'3f1a8c2e-profile.xml',checked:true,bytes:224256,meta:'219 KB'},{id:'b',name:'7b90d44a-profile.xml',checked:true,bytes:230400,meta:'225 KB'},\n      {id:'c',name:'default-profile.xml',checked:true,bytes:218112,meta:'213 KB'},{id:'d',name:'default-profile.xml.bak',checked:false,bytes:223232,meta:'218 KB',note:'You left it out'}]},\n    {id:'p2',name:'E:\\\\Steam\\\\steamapps\\\\common\\\\Risk of Rain 2\\\\Risk of Rain 2_Data\\\\Config',kind:'folder',checked:true,tag:'Settings',meta:'45 files',children:[{id:'e',name:'config.cfg',checked:true,bytes:3277,meta:'3 KB'}]},\n    {id:'p3',name:'E:\\\\Steam\\\\steamapps\\\\common\\\\Risk of Rain 2\\\\Risk of Rain 2_Data\\\\Logs',kind:'folder',checked:false,note:'Skipped: logs',meta:'12 files',children:[{id:'f',name:'output_log.txt',checked:false,bytes:1153434,meta:'1.1 MB'}]},\n    {id:'p4',name:'HKEY_CURRENT_USER\\\\Software\\\\Hopoo Games, LLC\\\\Risk of Rain 2',kind:'registry',checked:true,tag:'Registry',meta:'16 values',bytes:4096}]};\n// A render can open a section: #art, #launch, #files, #saves or #sync.\nReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'gs-scrim',style:{minHeight:700}},\n  h(G.GamePropertiesDialog,{game:GAME,section:(location.hash||'').slice(1)||'saves'})));\n\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>One game's settings, like Steam's Properties. It opens from the gear in the game's <code>PlayBar<\/code>, its More and right-click menus, Properties on its On this PC card, and Choose files… (which opens on Saves). Sections down the left, as in Settings (<code>SettingsNav<\/code>), <code>SettingsRow<\/code>s on the right.<\/p>\n<ul>\n<li><strong>General<\/strong>: the name GameSync shows (a rescan keeps it), Favourite, Show in the library (a hidden game still syncs), and the game's ID for the command line, with Copy. A game with an anti-cheat says so here: it starts only through its launcher, learn mode stays off, and its saves are never shared.<\/li>\n<li><strong>Art<\/strong>: the game's cover (its tile), banner (the top of its page, and Home's when it's the last played) and logo (over the banner, in place of its name), each Steam's or an image of your own: Choose an image… opens Windows' picker, and Use Steam's puts Steam's back. Your own images stay on this PC, never synced or shared; JPEG, PNG or WebP up to 8 MB, checked by their content like Steam's art (ART-08). It opens from the game's More menu too (Change the art…).<\/li>\n<li><strong>Launch<\/strong>: how it starts. A store game starts through its store, so the store's own launch options apply: they show read-only with Open in Steam, and Starting from Steam copies the line to put in Steam's launch options so a start from Steam gets GameSync's check too. A game in its own folder shows its program (Change…) and its launch options in a text field.<\/li>\n<li><strong>Installed files<\/strong>: the folder (Open the folder), its size, the store and app ID (Store page), the build, the engine and how GameSync found it. A game not installed says its saves are still on this PC.<\/li>\n<li><strong>Saves<\/strong>: which files are backed up, as a <code>FileTree<\/code> of the places found or added: tick to back up and sync, untick to keep a file on this PC only. Older versions keep what they had, and nothing is deleted. The line above says how many files and how much. Add a file or folder; Learn mode (never for a game with an anti-cheat). Then Settings files, Screenshots and Skip logs, crash dumps and caches, each starting from the defaults in Settings, Backup and sync.<\/li>\n<li>A game <strong>not syncing yet<\/strong> shows what the scan found, its boxes greyed and ticked as syncing would take them, until its saves sync.<\/li>\n<li><strong>Sync<\/strong>: Between your PCs or Back up only (for a game its store syncs), who wins when both PCs changed it (Newest wins, Always ask, This PC wins), and Stop syncing it, which asks first.<\/li>\n<li>Changes wait for <strong>Save changes<\/strong>; the foot says how many there are. Cancel, Esc and the close button drop them, asking first when there are some. A game's own choices travel with its saves, so its other PCs take the same files (R8).<\/li>\n<\/ul>"},{"name":"PlayBar","group":"Launcher","height":260,"subtitle":"Under a game's hero: Play, the facts, the game's buttons; and when it needs you","src":"<\!-- @dsCard group=\"Launcher\" height=260 subtitle=\"Under a game's hero: Play, the facts, the game's buttons; and when it needs you\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);} .pv{padding:24px;} <\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n\nfunction actions(fav){return [h(G.IconButton,{key:'f',icon:'star',pressed:fav,label:fav?'Remove from favourites':'Add to favourites'}),h(G.IconButton,{key:'p',icon:'settings',label:'Properties'}),h(G.IconButton,{key:'m',icon:'more',label:'More'})];}\nReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'pv gs-stack'},\n  h(G.PlayBar,{label:'Risk of Rain 2',primary:h(G.Button,{variant:'primary',icon:'play'},'Play'),actions:actions(true),stats:[\n    {label:'Last played',value:'25 Sep'},{label:'Play time',value:'218 hours'},{label:'Achievements',value:'43 of 58'},{label:'Saves',value:'Synced',status:'synced'}]}),\n  h(G.PlayBar,{label:'Cuphead',primary:[h(G.Button,{key:'r',variant:'primary',icon:'pause'},'Review'),h(G.IconButton,{key:'p',icon:'play',label:'Play'})],actions:actions(false),stats:[\n    {label:'Last played',value:'20 Sep'},{label:'Play time',value:'22 hours'},{label:'Saves',value:'Held for review',status:'held'}]})));\n\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>The bar under a game's hero, like Steam's: Play, then the facts a player looks for, then the game's own buttons.<\/p>\n<p>Provide <code>primary<\/code>, <code>stats<\/code> and <code>actions<\/code>.<\/p>\n<ul>\n<li><code>primary<\/code>: Play (a primary <code>Button<\/code> with <code>play<\/code>); Playing, disabled, while the game runs. When the game needs you, the status's own action is the primary (Resolve, Review, See where, See why; Add a place and Retry once their screens are built) with Play as an <code>IconButton<\/code> beside it. A Steam game not installed on this PC offers Install through Steam (secondary); any other game not installed here offers Locate the game… (secondary), which picks its program so Play can start it.<\/li>\n<li><code>stats<\/code>, in this order: Last played, Play time, Achievements (only for a game whose store tracks them), Saves (its status, given as <code>status<\/code>, shows as a plain <code>StatusBadge<\/code> so the icon and colour come with the word). Labels are <code>overline<\/code>, values 14px <code>ink<\/code>.<\/li>\n<li><code>actions<\/code>, in this order: the favourite star (<code>IconButton<\/code> with <code>pressed<\/code>), Properties (<code>settings<\/code>), More (<code>more<\/code>).<\/li>\n<li>It's a <code>Card<\/code>, so Glossy gives it the card's edge and lit top. In a narrow page the facts wrap under each other rather than squeezing.<\/li>\n<\/ul>"},{"name":"ConnectCloudDialog","group":"Launcher","height":680,"subtitle":"Connecting the cloud after first run skipped it: Google Drive or a folder, from Home's Connect the cloud","src":"<\!-- @dsCard group=\"Launcher\" height=680 subtitle=\"Connecting the cloud after first run skipped it: Google Drive or a folder, from Home's Connect the cloud\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);} .cc{width:620px}<\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n// #signed: signed in to Google Drive; #folder: a folder chosen; otherwise nothing connected yet.\nvar STATE = location.hash.slice(1);\nfunction Dialog(){\n  var signed = STATE === 'signed', folder = STATE === 'folder' ? 'D:\\\\GameSync' : null, connected = signed || !!folder;\n  return h('div',{className:'gs-dialog cc',role:'dialog','aria-modal':'true','aria-labelledby':'gs-cloud-title'},\n    h('div',{className:'gs-dialog-head'},\n      h('div',{className:'gs-card-head'},\n        h('div',null,h('h2',{id:'gs-cloud-title',className:'gs-dialog-title'},'Connect the cloud'),\n          h('p',{className:'gs-dialog-sub'},'Every version is on this PC for now. Once a cloud is connected, what waited goes up in the background.')),\n        h(G.IconButton,{icon:'x',label:'Close Connect the cloud'}))),\n    h('div',{className:'gs-dialog-body gs-dialog-roomy'},\n      h(G.Card,{title:'Google Drive'},\n        signed ? h(G.SettingsRow,{title:'Signed in as you@gmail.com',description:'The GameSync folder is ready. The first upload, about 1.1 GB, carries on in the background.'},h(G.StatusBadge,{status:'synced',label:'Connected'}))\n          : h(G.SettingsRow,{title:'Sign in with Google',description:'Opens your browser. GameSync asks only for its own folder in your Drive.'},h(G.Button,{variant:folder?'secondary':'primary',icon:'cloud'},'Sign in with Google'))),\n      h(G.Card,{title:'Or a folder'},\n        folder ? h(G.SettingsRow,{title:'Saves go to '+folder,description:'Every PC points at this folder; GameSync keeps its files in a GameSync folder inside it.'},h(G.StatusBadge,{status:'synced',label:'Ready'}))\n          : h(G.SettingsRow,{title:'Use a folder instead',description:'A NAS, a USB drive or another disk. Every PC points at the same folder.'},h(G.Button,{variant:'secondary',icon:'folder'},'Choose a folder')))),\n    h('div',{className:'gs-dialog-foot'},\n      h('div',{className:'gs-note'},h(G.Icon,{name:'monitor',size:16}),'Your other PC joins by connecting the same account or folder.'),\n      h('div',{className:'gs-dialog-actions'},h('span'),\n        h(G.Button,{variant:connected?'primary':'ghost',icon:connected?'check':null},connected?'Done':'Not now'))));\n}\nReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'gs-scrim',style:{minHeight:660}},h(Dialog)));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Connecting the cloud after first run skipped it. It opens from Home's Connect the cloud, the small button that takes the cloud button's place in the top bar while no cloud is connected (see Launcher home, <code>#nocloud<\/code>), and later from Settings, Cloud.<\/p>\n<ul>\n<li>The same two ways as first run's Connect the cloud step, each a <code>Card<\/code>: Sign in with Google (the primary; it opens the browser, and GameSync asks only for its own folder) or a folder (a NAS, a USB drive, another disk). Once either is connected it says so (<code>#signed<\/code>, <code>#folder<\/code>) and the foot's button reads Done; before, Not now closes it.<\/li>\n<li>Every version GameSync kept while there was no cloud stays on this PC and goes up in the background once one is connected; nothing is lost by waiting.<\/li>\n<li>The foot's note says the other PC joins by connecting the same account or folder.<\/li>\n<\/ul>"},{"name":"AddGameDialog","group":"Launcher","height":700,"subtitle":"A game or folder of your own, from the library's Add game and first run: a name, its folder and, optionally, the program that uses it","src":"<\!-- @dsCard group=\"Launcher\" height=700 subtitle=\"A game or folder of your own, from the library's Add game and first run: a name, its folder and, optionally, the program that uses it\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);}<\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n// A game server's world with no program, as the library adds it; or #empty (nothing picked yet), #program (an old game\n// with its program), #programs (the whole server folder, programs and all), #refused (a folder too wide to add) and\n// #setup (from first run, where it only joins the list).\nvar STATE = location.hash.slice(1);\nvar WORLD = {path:'D:\\\\Servers\\\\Minecraft\\\\world', files:142, bytes:40265318, newest:'today 20:55', programs:0};\nvar PROPS = STATE === 'empty' ? {}\n  : STATE === 'program' ? {name:'Diablo II', folder:{path:'C:\\\\Users\\\\You\\\\Saved Games\\\\Diablo II', files:12, bytes:2202009, newest:'yesterday 23:10', programs:0},\n      program:{path:'D:\\\\Games\\\\Diablo II\\\\Game.exe'}}\n  : STATE === 'programs' ? {name:'Minecraft server', folder:{path:'D:\\\\Servers\\\\Minecraft', files:318, bytes:71303168, newest:'today 20:55', programs:3}}\n  : STATE === 'refused' ? {name:'My saves', folder:{path:'C:\\\\Users\\\\You\\\\Documents', state:'refused',\n      message:'That\\u2019s your whole Documents folder, far more than one game\\u2019s saves. Pick the game\\u2019s own folder inside it.'}}\n  : {name:'Minecraft server world', folder:WORLD, setup:STATE === 'setup'};\nReactDOM.createRoot(document.getElementById('root')).render(\n  h('div',{className:'gs-scrim',style:{minHeight:680}},h(G.AddGameDialog,PROPS)));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Dialog that adds a game or folder of the person's own (LIB-13): a game GameSync didn't find, or any folder to keep in step between PCs, like a game server's world. It opens from the library's Add game and from first run's Something missing?.<\/p>\n<p>Provide <code>name<\/code>, <code>folder<\/code> once one is picked (<code>{path, files, bytes, newest, programs?, state?, message?}<\/code>), <code>program<\/code> once one is picked (<code>{path}<\/code>), <code>setup<\/code> over first run, and <code>onName<\/code>, <code>onPickFolder<\/code> and <code>onPickProgram<\/code> (Windows' folder and file pickers), <code>onRemoveProgram<\/code>, <code>onOpen<\/code>, <code>onAdd({name})<\/code> and <code>onClose<\/code>.<\/p>\n<ul>\n<li><strong>Name<\/strong>: what the library calls it. Picking a folder fills it in from the folder's name when it's empty; the person can change it.<\/li>\n<li><strong>Folder<\/strong>: nothing picked shows Choose a folder…; picked, the <code>FolderField<\/code> with this PC's full path and what's there (files, size, when it last changed), Change… and Open in Explorer.<\/li>\n<li><strong>Program that uses it<\/strong>, optional: with one (an old game's <code>.exe<\/code>), GameSync syncs when it closes, and Play starts it; without one, once the folder has been quiet for 5 minutes, so a server's world syncs between its autosaves and after the server stops. A chosen program shows in a well with Remove.<\/li>\n<li>Program files in the folder are never copied (R1). A <code>shield<\/code> note says so and, once a folder is picked, how many it holds (<code>#programs<\/code>): the save or world folder is the one to pick, not the whole game or server.<\/li>\n<li><code>state: \"warn\"<\/code> adds a <code>warn<\/code> line when another game keeps saves there too (FOLD-11). <code>state: \"refused\"<\/code> (<code>#refused<\/code>): the <code>FolderField<\/code> turns refused and says why and what to pick instead, for the same folders Add a place refuses: a drive's root, a whole Windows folder, Windows or Program Files themselves, GameSync's own folders.<\/li>\n<li>The primary is <strong>Add and sync<\/strong>: the game is backed up at once and syncs from then on. It stays off until there's a name and a folder that can be added, and its tooltip says which is missing. Over first run (<code>setup<\/code>, <code>#setup<\/code>) it reads <strong>Add<\/strong>: the game joins Choose games' Sync group, ticked, and nothing syncs until Start using GameSync.<\/li>\n<li>The foot tells the person that their other PC joins by adding its own folder under the same name.<\/li>\n<\/ul>"},{"name":"ConsoleLog","group":"Save manager","height":250,"width":null,"subtitle":"","src":"<\!-- @dsCard group=\"Save manager\" height=250 -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);} .pv{padding:24px;} <\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\" class=\"pv\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n\nvar ART = \"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%201200%20500%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Crect%20width%3D%271200%27%20height%3D%27500%27%20fill%3D%27%231b2a33%27/%3E%3Ccircle%20cx%3D%27860%27%20cy%3D%27150%27%20r%3D%2770%27%20fill%3D%27%237fe6f2%27%20opacity%3D%27.35%27/%3E%3Cpath%20d%3D%27M0%20330%20L180%20200%20L330%20300%20L520%20150%20L700%20290%20L880%20190%20L1200%20320%20V500%20H0Z%27%20fill%3D%27%23223640%27/%3E%3Cpath%20d%3D%27M0%20400%20L220%20290%20L420%20380%20L640%20270%20L860%20370%20L1040%20300%20L1200%20360%20V500%20H0Z%27%20fill%3D%27%23182730%27/%3E%3Cpath%20d%3D%27M0%20460%20L300%20390%20L600%20450%20L900%20380%20L1200%20440%20V500%20H0Z%27%20fill%3D%27%2310191f%27/%3E%3C/svg%3E\";\nvar COVERS = [\"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20200%20300%27%3E%3Crect%20width%3D%27200%27%20height%3D%27300%27%20fill%3D%27%232b2220%27/%3E%3Ccircle%20cx%3D%27140%27%20cy%3D%2790%27%20r%3D%2738%27%20fill%3D%27%23e0b36a%27%20opacity%3D%27.5%27/%3E%3Cpath%20d%3D%27M0%20220%20L70%20160%20L130%20210%20L200%20150%20V300%20H0Z%27%20fill%3D%27%23e0b36a%27%20opacity%3D%27.35%27/%3E%3C/svg%3E\", \"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20200%20300%27%3E%3Crect%20width%3D%27200%27%20height%3D%27300%27%20fill%3D%27%231d2a24%27/%3E%3Ccircle%20cx%3D%27140%27%20cy%3D%2790%27%20r%3D%2738%27%20fill%3D%27%237fd1a6%27%20opacity%3D%27.5%27

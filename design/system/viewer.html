', size:913408, versions:23, backup:'18:40 today'},\n  {id:'cuphead', name:'Cuphead', art:COVERS[3], status:'newer-in-cloud', play:'22 h', last:'20 Sep', path:'LocalLow\\\\StudioMDHR\\\\Cuphead', size:48128, versions:9, backup:'20 Sep'},\n  {id:'wukong', name:'Black Myth: Wukong', art:COVERS[4], status:'held', play:'74 h', last:'18 Sep', path:'G:\\\\Black Myth Wukong\\\\b1\\\\Saved\\\\SaveGames', size:31457280, versions:17, backup:'18 Sep'},\n  {id:'ds3', name:'Dark Souls III', art:COVERS[5], status:'backup-only', play:'96 h', last:'2 Sep', path:'%APPDATA%\\\\DarkSoulsIII\\\\0110000', size:6815744, versions:31, backup:'2 Sep'},\n  {id:'gtav', name:'GTA V Enhanced', art:COVERS[6], status:'synced', play:'40 h', last:'29 Aug', path:'Documents\\\\Rockstar Games\\\\GTAV Enhanced\\\\Profiles', size:12582912, versions:11, backup:'29 Aug', blocked:'Ships an anti-cheat and has an online mode, so it can\\u2019t be shared.'}\n];\nfunction shareGames(){ return GAMES.map(function(g){var vs=[{id:'latest',label:'Latest',when:g.backup,pc:'DESKTOP',size:g.size},{id:'prev',label:'Previous',when:'1 day earlier',pc:'LAPTOP',size:Math.round(g.size*0.97)}];if(g.id==='sekiro')vs.push({id:'pin',label:'Before update 1.06',when:'12 Sep',pc:'DESKTOP',size:2097152,pinned:true});return {id:g.id,name:g.name,art:g.art,size:g.size,totalSize:Math.round(g.size*Math.min(g.versions,10)*0.35),versionCount:Math.min(g.versions,10),versions:vs,blocked:g.blocked};}); }\nvar IMPORT_ITEMS = [\n  {id:'terraria', name:'Terraria', art:COVERS[1], match:'matched', versions:1, size:338000000},\n  {id:'sekiro', name:'Sekiro: Shadows Die Twice', art:COVERS[0], match:'matched', versions:2, size:4299161, warn:'Made on another Steam account. FromSoftware saves check the account, so it may not load.'},\n  {id:'hk', name:'Hollow Knight', art:null, match:'not-installed', versions:1, size:1153434, removed:'1 program file (launcher.dll) was left out.'},\n  {id:'mystery', name:'Unknown game (a friend’s custom entry)', art:null, match:'unknown', versions:1, size:524288}\n];\n\nReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'gs-scrim',style:{minHeight:780}},h(G.ShareSavesDialog,{games:(function(){var g=shareGames();var gt=g.pop();g.splice(2,0,gt);return g;})(),initialSelection:['sekiro','terraria'],expanded:['sekiro']})));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Dialog that packs saves into one zip for sharing, either picked saves or everything.<\/p>\n<p>Provide <code>games<\/code> (<code>{id, name, art, size, totalSize, versionCount, blocked?, versions: [{id, label, when, pc, size, pinned?}]}<\/code>), <code>mode<\/code> (<code>pick<\/code> or <code>all<\/code>), <code>initialSelection<\/code> (game ids, from the table's selection), <code>expanded<\/code> (games open to show versions), <code>saveRoot<\/code>, <code>outDir<\/code>, <code>onCreate(request)<\/code> and <code>onClose<\/code>.<\/p>\n<ul>\n<li><strong>Choose saves<\/strong>: ticking a game takes its latest version; the chevron opens its versions so the person can add older or pinned ones. The footer shows games, versions, the zip name and total size as they change.<\/li>\n<li><strong>Share all<\/strong>: packs the whole save folder and shows its size up front; \"Only the latest save of each game\" makes it smaller.<\/li>\n<li><strong>Locked games<\/strong>: give a game <code>blocked<\/code> with the reason (\"Ships an anti-cheat and has an online mode, so it can't be shared.\"). It shows locked and can't be ticked, and Share all names it as left out.<\/li>\n<li>After Create zip it shows progress, then the path with Copy path and Show in folder.<\/li>\n<li>Always keep the note that only save data goes in the zip and that a README inside explains a manual restore.<\/li>\n<\/ul>"},{"name":"FileTree","group":"Save manager","height":380,"subtitle":"A game's save files: tick to back up, untick to keep on this PC; skipped and locked files say why","src":"<\!-- @dsCard group=\"Save manager\" height=380 subtitle=\"A game's save files: tick to back up, untick to keep on this PC; skipped and locked files say why\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);} .pv{padding:24px;} <\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n\nvar ITEMS=[\n  {id:'p1',name:'E:\\\\Steam\\\\userdata\\\\41755\\\\632360\\\\remote\\\\UserProfiles',kind:'folder',checked:true,mixed:true,open:true,meta:'4 files',children:[\n    {id:'a',name:'3f1a8c2e-profile.xml',checked:true,bytes:224256,meta:'219 KB'},\n    {id:'b',name:'default-profile.xml',checked:true,bytes:218112,meta:'213 KB'},\n    {id:'c',name:'default-profile.xml.bak',checked:false,bytes:223232,meta:'218 KB',note:'You left it out'}]},\n  {id:'p2',name:'Risk of Rain 2_Data\\\\Config',kind:'folder',checked:true,tag:'Settings',meta:'45 files',children:[{id:'d',name:'config.cfg',checked:true,bytes:3277,meta:'3 KB'}]},\n  {id:'p3',name:'Risk of Rain 2_Data\\\\Logs',kind:'folder',checked:false,note:'Skipped: logs',meta:'12 files',children:[{id:'e',name:'output_log.txt',checked:false,bytes:1153434,meta:'1.1 MB'}]},\n  {id:'p4',name:'HKEY_CURRENT_USER\\\\Software\\\\Hopoo Games, LLC\\\\Risk of Rain 2',kind:'registry',checked:true,tag:'Registry',meta:'16 values',bytes:4096},\n  {id:'p5',name:'Risk of Rain 2.exe',locked:true,note:'A program file: never backed up',meta:'651 KB'}];\nfunction Demo(){\n  var t=React.useState(ITEMS), c=G.fileTree.count(t[0]);\n  return h('div',{className:'pv gs-stack',style:{gap:10}},\n    h('div',{className:'gs-mono gs-muted',style:{fontSize:12}},c.files+' of '+c.all+' files \\u00b7 '+G.formatBytes(c.bytes)+' backed up'),\n    h(G.FileTree,{label:'Risk of Rain 2\\u2019s save files',items:t[0],onToggle:function(id,on){t[1](G.fileTree.toggle(t[0],id,on))}}));\n}\nReactDOM.createRoot(document.getElementById('root')).render(h(Demo));\n\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>A game's save files, each with a checkbox: ticked files are backed up and synced, unticked ones stay on this PC only. It's how a person opts files in or out, in a game's Properties under Saves.<\/p>\n<p>Provide <code>items<\/code> (places, folders with <code>children<\/code>, files, registry keys) and <code>onToggle(id, checked)<\/code>. <code>fileTree.toggle(items, id, checked)<\/code> returns the tree with that item and everything under it changed and its folders' boxes updated; <code>fileTree.count(items)<\/code> adds up what's backed up, for the line above the tree.<\/p>\n<ul>\n<li>A top-level item is a place: the folder as this PC has it, in <code>mono<\/code>, with how many files it holds. A folder's box is ticked, empty, or mixed when some of it is in.<\/li>\n<li><code>tag<\/code> marks settings files (Settings) and registry keys (Registry). <code>note<\/code> says why something is out: \"Skipped: logs\" (the defaults), \"You left it out\".<\/li>\n<li><code>locked<\/code> items can't be ticked and show a lock with the reason: a program file is never backed up (R1).<\/li>\n<li>Sizes and counts sit at the right in <code>mono<\/code>. The tree sits in a well (<code>surface-well<\/code>, <code>edge-well<\/code>), rows hover on <code>bg-300<\/code>.<\/li>\n<li>Unticking never deletes: the files stay on the PC, and older versions keep them.<\/li>\n<\/ul>"},{"name":"AddPlaceDialog","group":"Save manager","height":620,"subtitle":"A place a game keeps saves, set by hand: how every PC reads it, what's there, what it holds","src":"<\!-- @dsCard group=\"Save manager\" height=620 subtitle=\"A place a game keeps saves, set by hand: how every PC reads it, what's there, what it holds\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);}<\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n// #pick: nothing picked yet; #refused: a folder too wide to add; otherwise a folder picked and ready to add.\nvar STATE = location.hash.slice(1);\nvar PLACE = STATE === 'pick' ? null\n  : STATE === 'refused' ? {kind:'folder', path:'C:\\\\Users\\\\You\\\\Documents', state:'refused',\n      message:'That\\u2019s your whole Documents folder, far more than one game\\u2019s saves. Pick the game\\u2019s own folder inside it.'}\n  : {kind:'folder', path:'C:\\\\Users\\\\You\\\\AppData\\\\LocalLow\\\\Team Cherry\\\\Hollow Knight', portable:'<localLow>/Team Cherry/Hollow Knight',\n      files:6, bytes:1153434, newest:'today 21:04', programs:0};\nReactDOM.createRoot(document.getElementById('root')).render(\n  h('div',{className:'gs-scrim',style:{minHeight:600}},h(G.AddPlaceDialog,{game:'Hollow Knight',place:PLACE})));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Dialog that adds a place a game keeps saves, set by hand (FOLD-01): a folder or one save file GameSync didn't find, shown as every PC will read it before anything is added.<\/p>\n<p>Provide <code>game<\/code> (its name), <code>place<\/code> once one is picked (<code>{kind, path, portable, portableNote?, files, bytes, newest, programs?, state?, message?}<\/code>), <code>onPick(kind)<\/code> (opens Windows' folder or file picker), <code>onOpen<\/code>, <code>onAdd({path, category})<\/code> and <code>onClose<\/code>.<\/p>\n<ul>\n<li><strong>Nothing picked<\/strong>: Choose a folder… (the usual case) or Choose a file… (a game that keeps one save file among others).<\/li>\n<li><strong>Picked<\/strong>: the <code>FolderField<\/code> with this PC's full path and what's there (files, size, newest), Change… and Open in Explorer; then <strong>Every PC reads it as<\/strong>, the portable form in <code>mono<\/code> (<code>&lt;localLow&gt;/Team Cherry/Hollow Knight<\/code>), so the other PCs find it in their own folders. A folder under none of Windows' own folders stays a full path, and <code>portableNote<\/code> says the other PCs need the same drive and folder.<\/li>\n<li><strong>What it holds<\/strong>, a <code>Select<\/code>: Game saves (synced between PCs), Settings (each PC keeps its own) or Screenshots (backed up on this PC), as the game's other places do.<\/li>\n<li>Program files in it are never taken (R1); a <code>shield<\/code> note says how many there are. <code>state: \"warn\"<\/code> adds a <code>warn<\/code> line (another game keeps saves there too: a file both claim shows as an error on both games, FOLD-11).<\/li>\n<li><code>state: \"refused\"<\/code>: the <code>FolderField<\/code> turns refused and says why and what to pick instead: a drive's root, a whole Windows folder (Documents, AppData, the user folder), Windows or Program Files themselves, or GameSync's own folders. Add this place stays off.<\/li>\n<li>The foot says it's backed up at the next sync, that other PCs are asked before they take a new place (R8), and that nothing in it is ever deleted. Opens from Add a place on a game's saves, from its Saves not found action, and from Properties, on Saves.<\/li>\n<\/ul>"},{"name":"ImportKeptSavesDialog","group":"Save manager","height":720,"subtitle":"Save folders kept by hand, as named saves; the folders are never changed","src":"<\!-- @dsCard group=\"Save manager\" height=720 subtitle=\"Save folders kept by hand, as named saves; the folders are never changed\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);}<\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n// #pick: before the folder is chosen; #done: after Import; otherwise the kept copies found, ready to import.\nvar STATE = location.hash.slice(1);\nvar ITEMS = [\n  {id:'k1', name:'Before Father Gascoigne', saved:'4 Sep 20:12', files:3, bytes:1153434},\n  {id:'k2', name:'Before Vicar Amelia', saved:'9 Sep 22:40', files:3, bytes:1160192, kept:true},\n  {id:'k3', name:'Before Rom', saved:'12 Sep 21:05', files:3, bytes:1171456},\n  {id:'k4', name:'After Rom', saved:'12 Sep 21:05', files:3, bytes:1171456, same:'Before Rom'},\n  {id:'k5', name:'Before Orphan of Kos', saved:'20 Sep 23:18', files:3, bytes:1189888}];\nvar props = STATE === 'pick' ? {game:'Bloodborne', stage:'pick'}\n  : {game:'Bloodborne', folder:'D:\\\\Saves\\\\Bloodborne\\\\CUSA00207', items:ITEMS, stage:STATE === 'done' ? 'done' : 'review',\n     skipped:['SPRJ0005 is the live save, so it\\u2019s left as it is.']};\nReactDOM.createRoot(document.getElementById('root')).render(\n  h('div',{className:'gs-scrim',style:{minHeight:700}},h(G.ImportKeptSavesDialog,props)));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Dialog that brings in save folders kept by hand as named saves (BAK-19): copies of a game's save, each in a folder named after the moment (\"Before Orphan of Kos\"), beside the live save or anywhere else.<\/p>\n<p>Provide <code>game<\/code>, <code>folder<\/code> once picked, <code>items<\/code> (<code>{id, name, saved, files, bytes, same?, kept?}<\/code>), <code>skipped<\/code> (why a folder in it isn't a kept copy), <code>roots<\/code> and <code>root<\/code> when the game has more than one save folder, <code>stage<\/code> (<code>pick<\/code>, <code>review<\/code>, <code>done<\/code>), <code>onPick<\/code> (opens Windows' folder picker), <code>onRoot<\/code>, <code>onOpen<\/code>, <code>onImport<\/code> and <code>onClose<\/code>.<\/p>\n<ul>\n<li><strong>Pick<\/strong>: what a kept copy looks like, and Choose the folder….<\/li>\n<li><strong>Review<\/strong>: the <code>FolderField<\/code> with the folder and how many kept copies it holds (Change…); <strong>They're copies of<\/strong> (a <code>Select<\/code>) when the game keeps saves in more than one place; then each copy by name with when it was saved, its files and size, newest last. A copy identical to another here, or to a named save, says Same as that one and isn't named again; one identical to a version already in the history says Already kept, and that version takes its name, stored once. <code>skipped<\/code> lines, in <code>warn<\/code>, say what was left alone: the live save itself, a folder with no save in it.<\/li>\n<li>The foot counts the named saves the import makes (and the copies not kept twice) and the space the new files take, and says the folders are never changed and each copy is kept aside, never current by itself. Import N named saves is the one primary.<\/li>\n<li><strong>Done<\/strong>: how many were imported, where they are (Named saves, on every PC), and that Restore brings one back, keeping the files there now first. Opens from Import kept saves… on a game's Named saves card.<\/li>\n<\/ul>"},{"name":"KeptCopiesDialog","group":"Save manager","height":860,"subtitle":"Sync only the live save, and bring the copies kept by hand beside it in as named saves (KAN-61)","src":"<\!-- @dsCard group=\"Save manager\" height=860 subtitle=\"Sync only the live save, and bring the copies kept by hand beside it in as named saves (KAN-61)\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);}<\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n// #backup: from Back up now on a game not syncing yet; #done: after the primary; otherwise Sync these saves.\nvar STATE = location.hash.slice(1);\nvar MB = 1048576;\nvar ITEMS = [\n  {id:'c1', name:'Witch ded', saved:'25 Aug 22:41', files:15, bytes:Math.round(14.3*MB)},\n  {id:'c2', name:'After Abandoned Workshop Before Amelia', saved:'26 Aug 19:07', files:15, bytes:Math.round(14.3*MB)},\n  {id:'c3', name:'Before Iosefka clinic and FF boss', saved:'26 Aug 20:55', files:30, bytes:Math.round(28.6*MB)},\n  {id:'c4', name:'Before Iosefka clinic and FF boss / anoter', saved:'26 Aug 21:20', files:30, bytes:Math.round(28.6*MB)},\n  {id:'c5', name:'After ROM at chapel', saved:'27 Aug 23:02', files:30, bytes:Math.round(28.6*MB)},\n  {id:'c6', name:'Before Crow', saved:'29 Aug 21:44', files:30, bytes:Math.round(28.6*MB)},\n  {id:'c7', name:'Before Crow (zip)', saved:'29 Aug 21:44', files:30, bytes:Math.round(28.6*MB), same:'Before Crow'},\n  {id:'c8', name:'After crow', saved:'30 Aug 00:13', files:30, bytes:Math.round(28.6*MB)},\n  {id:'c9', name:'SPRJ0005 - Copy', saved:'2 Sep 23:39', files:32, bytes:Math.round(31.1*MB)},\n  {id:'c10', name:'BEFORE church dog lady', saved:'6 Sep 20:18', files:16, bytes:Math.round(15.3*MB)},\n  {id:'c11', name:'Mensis Fog', saved:'8 Sep 22:30', files:34, bytes:Math.round(33.6*MB)},\n  {id:'c12', name:'Near Bloody Bride', saved:'9 Sep 21:06', files:34, bytes:Math.round(33.6*MB)},\n  {id:'c13', name:'befo ludwig', saved:'10 Sep 23:51', files:34, bytes:Math.round(33.6*MB)},\n  {id:'c14', name:'After Failure', saved:'13 Sep 22:12', files:34, bytes:Math.round(33.6*MB)},\n  {id:'c15', name:'Befo living failure', saved:'13 Sep 22:12', files:34, bytes:Math.round(33.6*MB), same:'After Failure'},\n  {id:'c16', name:'after ludwig', saved:'13 Sep 23:40', files:34, bytes:Math.round(33.6*MB)},\n  {id:'c17', name:'After maria', saved:'15 Sep 01:22', files:34, bytes:Math.round(33.6*MB)},\n  {id:'c18', name:'Before Orphan', saved:'16 Sep 23:58', files:34, bytes:Math.round(33.6*MB)}];\nvar props = {game:'Bloodborne GOTY', mode:STATE === 'backup' ? 'backup' : 'sync', stage:STATE === 'done' ? 'done' : 'review', items:ITEMS, wholeBytes:1071872663,\n  live:{path:'G:\\\\Bloodborne GOTY\\\\Shadlix\\\\user\\\\savedata\\\\1\\\\CUSA00207\\\\SPRJ0005', saved:'17 Sep 02:14', files:34, bytes:Math.round(33.6*MB)}};\nReactDOM.createRoot(document.getElementById('root')).render(\n  h('div',{className:'gs-scrim',style:{minHeight:840}},h(G.KeptCopiesDialog,props)));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Dialog for a game whose save folder holds copies kept by hand beside its live save (KAN-61): only the live save syncs, and each copy comes in as a named save, in one step. Bloodborne players keep \"Before Orphan\\SPRJ0005\" beside the live \"SPRJ0005\"; without it, the whole folder would sync as one save, every copy in every version.<\/p>\n<p>Provide <code>game<\/code>, <code>live<\/code> (<code>{path, saved, files, bytes}<\/code>: the live save as this PC has it), <code>items<\/code> (the copies, as ImportKeptSavesDialog's: <code>{id, name, saved, files, bytes, same?}<\/code>), <code>skipped<\/code>, <code>wholeBytes<\/code> (the whole folder), <code>mode<\/code> (<code>sync<\/code>, or <code>backup<\/code> from Back up now, New named save… or Import kept saves… on a game not syncing yet, KAN-63), <code>stage<\/code> (<code>review<\/code>, <code>done<\/code>), <code>onSync(bring)<\/code>, <code>onWhole<\/code> and <code>onClose<\/code>.<\/p>\n<ul>\n<li><strong>Review<\/strong>: the live save in a well, under \"Syncs between your PCs\" (or \"Backed up, not synced between your PCs\"), with its path, when it was saved, its files and size. Then <strong>Bring the N copies beside it in as named saves<\/strong>, ticked: the copies by name with when each was saved, its files and size, oldest first; one identical to another here says Same as that one and isn't named again. Unticked, they stay in their folders, not backed up, and Import kept saves… brings them in later.<\/li>\n<li>The foot counts what's kept (the live save and N named saves) and its size, and says the folders stay as they are, and that copies made there later aren't synced (New named save… keeps one in a step).<\/li>\n<li>The primary syncs (or backs up) the live save and keeps the named saves. <strong>Sync all of it instead<\/strong> keeps the whole folder as one save, for a folder that isn't what it looks like; its tooltip says how big each version would be.<\/li>\n<li><strong>Done<\/strong>: that the live save syncs now, and where the named saves are (Named saves, on every PC).<\/li>\n<li>Opens from Sync these saves (a game's saves, its page's Saves card) when the scan found copies beside the live save, and from Back up now, New named save… and Import kept saves… on a game not syncing yet. A game's saves show the copies beside the live save under Where the saves are (GameSavesScreen <code>#bloodborne<\/code>).<\/li>\n<\/ul>"},{"name":"FolderField","group":"Settings","height":470,"width":null,"subtitle":"Normal, moving, drive missing, refused","src":"<\!-- @dsCard group=\"Settings\" height=470 subtitle=\"Normal, moving, drive missing, refused\" -->\n<!doctype html>\n<html lang=\"en\">\n<head><meta charset=\"utf-8\"><title>preview<\/title>\n<style>html,body{margin:0;background:var(--bg-100);} .pv{padding:24px;} <\/style>\n<\/head>\n<body class=\"gs-root\">\n<div id=\"root\" class=\"pv\"><\/div>\n<script>\nvar G = window.GameSync, h = React.createElement;\n\nvar ART = \"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%201200%20500%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Crect%20width%3D%271200%27%20height%3D%27500%27%20fill%3D%27%231b2a33%27/%3E%3Ccircle%20cx%3D%27860%27%20cy%3D%27150%27%20r%3D%2770%27%20fill%3D%27%237fe6f2%27%20opacity%3D%27.35%27/%3E%3Cpath%20d%3D%27M0%20330%20L180%20200%20L330%20300%20L520%20150%20L700%20290%20L880%20190%20L1200%20320%20V500%20H0Z%27%20fill%3D%27%23223640%27/%3E%3Cpath%20d%3D%27M0%20400%20L220%20290%20L420%20380%20L640%20270%20L860%20370%20L1040%20300%20L1200%20360%20V500%20H0Z%27%20fill%3D%27%23182730%27/%3E%3Cpath%20d%3D%27M0%20460%20L300%20390%20L600%20450%20L900%20380%20L1200%20440%20V500%20H0Z%27%20fill%3D%27%2310191f%27/%3E%3C/svg%3E\";\nvar COVERS = [\"data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20200%20300%27%3E%3Crect%20width%3D%27200%27%20height%3D%27300%27%20fill%3D%27%232b2220%27/%3E%3Ccircle%20cx%3D%27140%27%20cy%3D%2790%27%20r%3D%2738%27%20fill 3D%27%23ff8a7d%27%20opacity%3D%27.35%27/%3E%3C/svg%3E\"];\nvar GAMES = [\n  {id:'sekiro', name:'Sekiro: Shadows Die Twice', art:COVERS[0], status:'conflict', play:'61 h', last:'Today 21:04', path:'%APPDATA%\\\\Sekiro\\\\76561198\\\\S0000.sl2', size:2202009, versions:14, backup:'21:04 today'},\n  {id:'terraria', name:'Terraria', art:COVERS[1], status:'synced', play:'214 h', last:'Yesterday', path:'Documents\\\\My Games\\\\Terraria\\\\', size:341835776, versions:52, backup:'20:00 today'},\n  {id:'sts2', name:'Slay the Spire 2', art:COVERS[2], status:'playing', play:'38 h', last:'Now', path:'%APPDATA%\\\\SlayTheSpire2\\\\saves', size:913408, versions:23, backup:'18:40 today'},\n  {id:'cuphead', name:'Cuphead', art:COVERS[3], status:'newer-in-cloud', play:'22 h', last:'20 Sep', path:'LocalLow\\\\StudioMDHR\\\\Cuphead', size:48128, versions:9, backup:'20 Sep'},\n  {id:'wukong', name:'Black Myth: Wukong', art:COVERS[4], status:'held', play:'74 h', last:'18 Sep', path:'G:\\\\Black Myth Wukong\\\\b1\\\\Saved\\\\SaveGames', size:31457280, versions:17, backup:'18 Sep'},\n  {id:'ds3', name:'Dark Souls III', art:COVERS[5], status:'backup-only', play:'96 h', last:'2 Sep', path:'%APPDATA%\\\\DarkSoulsIII\\\\0110000', size:6815744, versions:31, backup:'2 Sep'},\n  {id:'gtav', name:'GTA V Enhanced', art:COVERS[6], status:'synced', play:'40 h', last:'29 Aug', path:'Documents\\\\Rockstar Games\\\\GTAV Enhanced\\\\Profiles', size:12582912, versions:11, backup:'29 Aug', blocked:'Ships an anti-cheat and has an online mode, so it can\\u2019t be shared.'}\n];\nfunction shareGames(){ return GAMES.map(function(g){var vs=[{id:'latest',label:'Latest',when:g.backup,pc:'DESKTOP',size:g.size},{id:'prev',label:'Previous',when:'1 day earlier',pc:'LAPTOP',size:Math.round(g.size*0.97)}];if(g.id==='sekiro')vs.push({id:'pin',label:'Before update 1.06',when:'12 Sep',pc:'DESKTOP',size:2097152,pinned:true});return {id:g.id,name:g.name,art:g.art,size:g.size,totalSize:Math.round(g.size*Math.min(g.versions,10)*0.35),versionCount:Math.min(g.versions,10),versions:vs,blocked:g.blocked};}); }\nvar IMPORT_ITEMS = [\n  {id:'terraria', name:'Terraria', art:COVERS[1], match:'matched', versions:1, size:338000000},\n  {id:'sekiro', name:'Sekiro: Shadows Die Twice', art:COVERS[0], match:'matched', versions:2, size:4299161, warn:'Made on another Steam account. FromSoftware saves check the account, so it may not load.'},\n  {id:'hk', name:'Hollow Knight', art:null, match:'not-installed', versions:1, size:1153434, removed:'1 program file (launcher.dll) was left out.'},\n  {id:'mystery', name:'Unknown game (a friend’s custom entry)', art:null, match:'unknown', versions:1, size:524288}\n];\n\nReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'gs-row',style:{gap:14,color:'var(--ink-muted)'}}, G.Icon.names.map(function(n){return h('span',{key:n,title:n,style:{display:'inline-flex',flexDirection:'column',alignItems:'center',gap:4,width:66,fontSize:10,fontFamily:'var(--font-mono)'}},h(G.Icon,{name:n,size:22}),n)})));\n<\/script>\n<\/body>\n<\/html>\n","readme":"<p>Outlined 24px icon from GameSync's own set; the only icon source for the app.<\/p>\n<p>Provide <code>name<\/code> (see <code>Icon.names<\/code>), optional <code>size<\/code> (default 20) and <code>label<\/code> when the icon stands alone and means something. Without <code>label<\/code> it is hidden from screen readers. <code>filled<\/code> fills the <code>star<\/code>, for a favourite.<\/p>\n<p><code>arrowLeft<\/code> is Back; <code>trophy<\/code>, achievements; <code>external<\/code>, a link that leaves GameSync (a store page); <code>file<\/code> and <code>key<\/code>, a file and a registry key in a <code>FileTree<\/code>; <code>settings<\/code> is also a game's Properties.<\/p>\n<ul>\n<li>Do: 20px on the rail, 18px in buttons, 14px in badges.<\/li>\n<li>Don't: mix in icons from other sets or fill them; only <code>play<\/code>, and the <code>star<\/code> of a favourite, are filled.<\/li>\n<\/ul>"}];
var DOCS = {"Overview":"<p>GameSync is a Windows game launcher that also keeps every game's saves backed up and synced across the owner's PCs. The system has two registers that share one palette: the <strong>Launcher<\/strong>, soft and art-led, for picking a game and playing it; and the <strong>Console<\/strong>, dense and monospaced, for managing saves, where the extra detail is the point. Dark first, with Light, Match Windows and pure black modes and six preset themes, and two surfaces: Glossy, the default, where each page sits on a blurred copy of the game's art, and Solid; the Theming section has the rules.<\/p>\n<h2>Voice and copy<\/h2>\n<ul>\n<li>Plain words, specific to one game. \"Sekiro changed on two PCs\", never \"Sync conflict detected\".<\/li>\n<li>Say what happened, then what GameSync did, then what the person can do: \"DESKTOP saved 21:04, LAPTOP saved 19:30. Newest kept, LAPTOP copy pinned.\"<\/li>\n<li>Buttons are verbs that name the result: \"Continue playing\", \"Create zip\", \"Package everything\", \"Show in folder\". No \"OK\", no \"Submit\".<\/li>\n<li>Sentence case everywhere, except <code>overline<\/code> labels and console column headers, which are uppercase.<\/li>\n<li>Recommend one action rather than offering a menu. The primary button is that recommendation.<\/li>\n<li>Times are 24-hour (<code>21:04<\/code>), dates short (<code>20 Sep<\/code>), sizes in <code>KB<\/code>/<code>MB<\/code>/<code>GB<\/code> with one decimal from MB up. PC names are uppercase (<code>DESKTOP<\/code>, <code>LAPTOP<\/code>) and set in <code>mono<\/code>.<\/li>\n<li>No emoji. Status carries an icon and a word, never colour alone.<\/li>\n<\/ul>\n<h2>Colour<\/h2>\n<ul>\n<li>The ground is <code>bg-100<\/code>; everything sits on <code>bg-200<\/code> cards with <code>radius-lg<\/code> corners. Cards are told apart by surface, not borders or shadows.<\/li>\n<li>In <strong>Glossy<\/strong>, the default surface, the page sits on a blurred, darkened copy of the game's art and the surfaces let it through at the screen's strength; cards, controls and console panes gain a hairline edge (<code>edge-card<\/code>, <code>edge-control<\/code>, <code>edge-console<\/code>), dialogs stay nearly opaque (<code>surface-dialog<\/code>), and rows set into a card become darker wells (<code>surface-well<\/code>). In <strong>Solid<\/strong> the edges are clear. Theming → Surface has the values.<\/li>\n<li>Controls inside a card sit on <code>bg-300<\/code>; hover goes to <code>bg-400<\/code>.<\/li>\n<li>Every theme has two colours. <code>primary<\/code> (cyan in the default Arcade theme) is for the one primary button per view, progress fills, the busiest activity days, checkbox and switch fills, the console prompt, the logo and focus rings. Text on a primary fill is always <code>on-primary<\/code>.<\/li>\n<li><code>secondary<\/code> marks where you are and what you picked: <code>secondary-soft<\/code> fills selected rows, ticked share and import items, the current rail button, the selected tab and settings section; <code>secondary<\/code> itself tints their icons, the tab count chip and 2 to 4 hour activity days. Never use it for an action.<\/li>\n<li>Status colours are fixed meanings and never change with the theme: <code>ok<\/code> = fine or moving (Synced, Upload pending, Newer in cloud); <code>warn<\/code> = needs you (Conflict, Held for review, Files in use, Saves not found); <code>play<\/code> = a game is running (Spotify's green); <code>danger<\/code> = Blocked only; <code>neutral<\/code> = Synced by its store (say which: \"Synced by Steam\"), Not available. Each has a <code>-soft<\/code> background for chips and banners, and an <code>-art<\/code> tint for a badge on cover art.<\/li>\n<li>The Console panes (save table, log) use <code>bg-000<\/code>, so they read as a terminal set into the app.<\/li>\n<li>Text: <code>ink<\/code> for content, <code>ink-muted<\/code> for secondary, <code>ink-faint<\/code> for timestamps and labels. All three pass 4.5:1 on <code>bg-000<\/code> to <code>bg-300<\/code>, <code>secondary-soft<\/code> and <code>primary-soft<\/code> in every theme.<\/li>\n<li>Anything on cover art (the hero's title, eyebrow, chip and glass buttons) uses <code>on-art<\/code>, <code>glass<\/code>, <code>glass-edge<\/code> and <code>art-scrim<\/code>, which stay the same in every theme and surface; a status badge on art takes its <code>-art<\/code> tint. In Glossy, art gets a 1px <code>edge-art<\/code> ring so it stays apart from the backdrop.<\/li>\n<\/ul>\n<h2>Type<\/h2>\n<ul>\n<li><code>sans<\/code> (Onest) for the Launcher and all prose; <code>mono<\/code> (JetBrains Mono) for the Console, paths, sizes, versions, times in tables and big numbers (<code>mono-stat<\/code>).<\/li>\n<li>One <code>hero-title<\/code> per screen. Card headers use <code>card-title<\/code>. Body copy is <code>body<\/code>; metadata under a title is <code>caption<\/code>.<\/li>\n<li>Console tables use <code>mono-body<\/code> cells and uppercase <code>mono-small<\/code> headers with 0.08em tracking. Right-align numbers with tabular figures.<\/li>\n<li>Both faces are Google Fonts; ship them inside the app as files. Fallbacks are Segoe UI Variable and Cascadia Mono, which Windows 11 has.<\/li>\n<\/ul>\n<h2>Shape and space<\/h2>\n<ul>\n<li>Everything clickable that isn't a row is a pill (<code>radius-pill<\/code>): buttons, tabs, chips, status badges. Icon buttons are 40px circles.<\/li>\n<li>Cards, tiles, the hero and dialogs use <code>radius-lg<\/code>; activity cells and inputs <code>radius-md<\/code>; checkboxes and console selection <code>radius-sm<\/code>.<\/li>\n<li>Page gutters <code>space-6<\/code>, card padding <code>space-5<\/code>, gaps between cards <code>space-4<\/code>. Buttons are <code>control-height<\/code> (40px); console rows <code>row-height<\/code> (36px).<\/li>\n<li>Only dialogs and tooltips cast <code>shadow-dialog<\/code>. Everything else is flat; in Glossy, cards add a lit top edge (<code>lift-card<\/code>).<\/li>\n<li>Hatching (a 135° stripe of <code>bg-400<\/code>) means \"some, but not much\": light activity days. Never use it as decoration or for missing art.<\/li>\n<\/ul>\n<h2>Layout<\/h2>\n<ul>\n<li><strong>Launcher home<\/strong>: <code>SideRail<\/code> on the left; a top bar with a greeting, <code>PillTabs<\/code> for the library view and icon buttons on the right; a <code>HeroBanner<\/code> for the last-played game; then a row of three cards: Needs you, Jump back in (<code>GameTile<\/code>s), Activity (<code>ActivityGrid<\/code>). A tile opens that game's page in the library; a Needs you row's button (Review, Resolve) opens its saves in the save manager, where that's done. The hero's Manage saves opens its saves, and its gear its Properties.<\/li>\n<li><strong>Game library<\/strong>: laid out like Steam's. A 272px <code>Card<\/code> down the left holds a <code>SearchField<\/code>, the sort (a <code>Menu<\/code>: Recently played, Name, Hours played, Recently added) and a <code>GameList<\/code> with Favourites first; the rest of the page is the covers (a top bar with <code>PillTabs<\/code> for the view, then <code>GameTile<\/code>s, favourites first) or, once a game is picked, that game's page. The view, the search and the sort apply to both sides. A right-click on a game opens Play, Add to favourites, Hide from the library and Properties. Add game opens <code>AddGameDialog<\/code>: a game GameSync didn't find, or any folder to keep in step, like a game server's world.<\/li>\n<li><strong>Save manager<\/strong>: same rail and top bar; a strip of <code>mono-stat<\/code> numbers; a selectable <code>ConsoleTable<\/code> of every game's saves; a live <code>ConsoleLog<\/code> beneath it. The top bar holds <strong>Share N selected<\/strong> (secondary, disabled until a row is ticked), <strong>Share all<\/strong> (secondary) and <strong>Sync now<\/strong> (primary). Its other tabs are <strong>Plan<\/strong> (what the next sync would do, and Run), <strong>Versions<\/strong> (every version of every game, newest first) and <strong>Log<\/strong> (everything GameSync did, searchable); see PlanScreen, VersionsScreen and LogScreen. A game's name opens <strong>its saves<\/strong>: Back and a breadcrumb, its status with its actions, Named saves and Where the saves are as <code>Card<\/code>s, every version as a <code>ConsoleTable<\/code> with Restore and Export, and its <code>ConsoleLog<\/code>. All save work happens here; a game's page only points to it.<\/li>\n<li><strong>Sharing<\/strong>: both share buttons open <code>ShareSavesDialog<\/code>. From a selection it opens on \"Choose saves\" with those games ticked; Share all opens on \"Share all\", which packages the whole save folder, optionally latest saves only. Games with an anti-cheat or an online mode are shown locked, with the reason, and left out. The result is one zip with a path the person can copy or show in Explorer.<\/li>\n<li><strong>Importing<\/strong>: the download icon button in the save manager opens <code>ImportSavesDialog<\/code>. Imported saves become pinned versions, never current ones; unknown games can't be imported.<\/li>\n<li><strong>Settings<\/strong>: the rail's Settings button opens a two-column screen: <code>SettingsNav<\/code> on the left (Appearance, Storage and folders, Backup and sync, Cloud, Devices, Notifications, Safety), <code>Card<\/code>s of <code>SettingsRow<\/code>s on the right. Appearance holds the Surface (Glossy or Solid), <code>ThemePicker<\/code> and <code>ColorSwatchPicker<\/code>; Storage and folders holds the backup folder (<code>FolderField<\/code>), history to keep, game folders to scan and extra save folders (<code>FolderList<\/code>), and where shared zips go. Backup and sync holds What to back up: the defaults every new game starts from (settings files and screenshots as <code>Select<\/code>s, the usual skips, patterns to skip).<\/li>\n<li><strong>Game detail<\/strong>: about the game, like Steam's page; it opens in the library beside the list. Back and a breadcrumb (My games › the game) at the top left; a shorter <code>HeroBanner<\/code> of just the art and the logo; a <code>PlayBar<\/code> with Play (or the status's own action when the game needs you), Last played, Play time, Achievements and Saves, the favourite star, Properties and More; then About (<code>Facts<\/code> from the store page) and Achievements on the left, and a small Saves <code>Card<\/code> (status, last backup, the save folder, Open in Saves) and On this PC on the right.<\/li>\n<li><strong>Game properties<\/strong>: a dialog, like Steam's Properties, with a <code>SettingsNav<\/code> of General, Launch, Installed files, Saves and Sync. Saves is where a person picks which files are backed up, in a <code>FileTree<\/code>; changes wait for Save changes.<\/li>\n<li><strong>Conflict<\/strong>: the game's name and what happened as the title, a suggestion <code>Card<\/code> that says why GameSync asked, the two sides as <code>Card<\/code>s with the suggested side's Keep button as the primary, Compare files opening a <code>ConsoleTable<\/code>, and Decide later.<\/li>\n<li><strong>Plan<\/strong>: a tab of the save manager. Run N changes replaces Sync now; one <code>ConsoleTable<\/code> of the changes, each ticked, and one of the games that won't run, each with its status and button.<\/li>\n<li><strong>First run<\/strong>: no rail; a <code>SettingsNav<\/code> of the four steps (Scan this PC, Choose games, Connect the cloud, Backups and startup) with a <code>check<\/code> on finished steps, one primary button per step, and grouped game <code>Card<\/code>s with a checkbox per group and per game. Choose games takes the full width: Sync, Synced by their store, Probably online-only, Saves found but game not installed and No saves found yet, then Something missing?, whose Add a game or folder opens <code>AddGameDialog<\/code>; the anti-cheat note sits beside Back and Continue.<\/li>\n<\/ul>\n<h2>Navigation and feedback<\/h2>\n<p>The screens follow Nielsen's ten heuristics and Shneiderman's eight golden rules; in GameSync they come down to these.<\/p>\n<ul>\n<li><strong>Always a way back.<\/strong> Every page below a rail destination (a game's page, a game's saves) has Back at its top left, then a breadcrumb that says where you are. Back returns to where you came from; Esc, Alt+Left and the mouse's back button do the same. A dialog closes with Esc, its close button and Cancel.<\/li>\n<li><strong>Say what's happening, where it happens.<\/strong> Every game shows its one status with an icon and a word, on its row, its tile, its page and its saves. A job shows progress in place and ends with one line saying what it did (\"Backed up: 1 changed file, 0.5 MB\").<\/li>\n<li><strong>Nothing that does nothing.<\/strong> A button that can't act now is disabled with the reason in its tooltip (\"Once you quit, it backs up by itself\"); a feature that isn't built isn't shown.<\/li>\n<li><strong>Ask before anything that writes into a game's folders<\/strong>, and say what's kept: \"Your files now are kept as a version first\". Choices that change what's backed up show their effect before they apply (\"12 of 14 files, 5.9 MB\") and wait for Save changes.<\/li>\n<li><strong>Easy to undo.<\/strong> Restores keep the files they replace as a version; unticking a file never deletes it; a hidden game has its Hidden view; favourites and sorts change back in one click.<\/li>\n<li><strong>Recognition over recall.<\/strong> Show paths, sizes, dates and PC names instead of asking for them; pick folders with a picker; copy command lines with a button.<\/li>\n<li><strong>The same thing in the same place.<\/strong> Back is always top left; the gear is always Properties; the primary button is the one recommendation; every game's status reads the same everywhere.<\/li>\n<li><strong>Shortcuts for people who use it a lot<\/strong>: Ctrl+F searches, Enter opens the first match, Up and Down move through the list, the Menu key opens a game's menu, Esc goes back.<\/li>\n<li><strong>Errors say which game, what happened and what to do<\/strong>, in plain words, never a code.<\/li>\n<\/ul>\n<h2>Iconography<\/h2>\n<ul>\n<li>Outlined icons on a 24px grid at a 1.75 stroke with round caps and joins, drawn at 20px (rail), 18px (buttons) and 14px (badges). <code>Icon<\/code> holds the full set; use its names, not other icon fonts.<\/li>\n<li>The only filled icons are <code>play<\/code>, and the <code>star<\/code> of a favourite (filled while it's on).<\/li>\n<li><code>arrowLeft<\/code> is Back, <code>settings<\/code> is Settings and a game's Properties, <code>trophy<\/code> is achievements, and <code>external<\/code> marks a link that leaves GameSync.<\/li>\n<li>The set is drawn for GameSync in a Lucide-like style; no icon library is bundled. Add new icons on the same grid and stroke.<\/li>\n<li>Logo: <code>assets/Logos/gamesync-mark.svg<\/code>, drawn in the default <code>primary<\/code>; in the app it takes the theme's <code>primary<\/code>. No wordmark.<\/li>\n<\/ul>\n<h2>Imagery<\/h2>\n<ul>\n<li>Every image slot is filled from one source, first match wins: Steam's official art for the game's Steam app ID (from the store's own records, or from the save list's Steam ID for Epic and loose copies of the same game); then SteamGridDB, only if the person has added their own free API key; then an image file the person picked; then a title cover. Never a stock image and never an empty box.<\/li>\n<li>Which Steam image goes where: <code>GameTile<\/code> takes the 600×900 library capsule (<code>library_capsule_2x<\/code>). <code>HeroBanner<\/code> takes the library hero (1920×620, or 3840×1240 on high-DPI screens) with the game's transparent logo (<code>logo.png<\/code>) in place of the text title, because Steam's hero art never contains text; the title stays for screen readers. Share, import and list rows take the 300×450 capsule (<code>library_capsule<\/code>). A landscape slot takes <code>header<\/code> (920×430).<\/li>\n<li>Get the file names from Steam's store API (<code>IStoreBrowseService/GetItems<\/code> with <code>include_assets<\/code>, no key needed): newer games keep their art under hashed paths that can't be guessed from the app ID.<\/li>\n<li>Tiles are 2:3 with <code>radius-lg<\/code>. The hero is a wide crop with an <code>art-scrim<\/code> fade at the bottom so <code>on-art<\/code> text reads in every theme; keep controls out of the hero's centre, where Steam keeps its key art.<\/li>\n<li>No art found: a title cover, the game's name in <code>ink<\/code> on <code>bg-300<\/code> with its first letter large in <code>bg-400<\/code>. Small covers in rows show just the letter.<\/li>\n<li>Art is cached on the PC and shown offline. It is decoration, not data: it never goes to the cloud or into a shared zip.<\/li>\n<\/ul>\n<h2>States and focus<\/h2>\n<ul>\n<li>Focus is a 2px <code>primary<\/code> ring offset by 2px on every control; it passes 3:1 on every surface in every theme.<\/li>\n<li>Selected rows, ticked share and import items, the current page and the selected tab fill with <code>secondary-soft<\/code>; so does the open game's row in the library's list.<\/li>\n<li>A toggle icon button that's on (the favourite star) fills its icon, in <code>secondary<\/code> off art and <code>on-art<\/code> on it.<\/li>\n<li>Switches and checkboxes: off shows a <code>line-200<\/code> edge, on fills with <code>primary<\/code>.<\/li>\n<li>Disabled controls drop to 45% opacity and keep their label.<\/li>\n<li>Motion is short (120–200ms) on colour and progress width. Changes of game are slower and softer: a game's picture fades to the next (0.7s), Glossy's backdrop brightens in from where the person clicked (0.75s), and the playing glow eases in and out (0.9s). With Windows' animation effects off, nothing moves.<\/li>\n<\/ul>","Theming":"<h1>Theming<\/h1>\n<p>A theme is four choices: a <strong>mode<\/strong> (Dark, Light or Match Windows), <strong>pure black<\/strong> (dark mode only), a <strong>preset<\/strong> (a primary colour, a secondary colour and a faint surface tint), and, if the person wants, their own <strong>primary<\/strong> or <strong>secondary<\/strong> from the swatches. One engine, <code>GameSync.theme.build()<\/code>, turns those choices into every colour token, so presets, swatches, the Windows accent and later custom colours all go through the same rules. A fifth choice, the <strong>surface<\/strong> (Glossy or Solid), sets how the page sits on the game's art; see Surface below.<\/p>\n<h2>What never changes<\/h2>\n<ul>\n<li>Status colours: <code>ok<\/code>, <code>warn<\/code>, <code>danger<\/code>, <code>play<\/code>, <code>neutral<\/code> and their <code>-soft<\/code> grounds have one value per mode and ignore the preset. A Conflict is amber with its warning icon in every theme.<\/li>\n<li>Cover-art colours: <code>on-art<\/code>, <code>glass<\/code>, <code>glass-edge<\/code> and <code>art-scrim<\/code> are the same in every mode, because they sit on game art, not on the theme. A status badge on art takes its <code>-art<\/code> tint (<code>ok-art<\/code> and the rest): the same in every dark theme and both surfaces, and the opaque <code>-soft<\/code> in light mode.<\/li>\n<li>Shapes, type, spacing and radii. A theme only recolours.<\/li>\n<\/ul>\n<h2>Presets<\/h2>\n<table><thead><tr><th>Preset<\/th><th>Primary<\/th><th>Secondary<\/th><th>Surface tint<\/th><th>Dark: primary, secondary<\/th><th>Light: primary, secondary<\/th><\/tr><\/thead><tbody><tr><td>Arcade (default)<\/td><td>Cyan<\/td><td>Steel<\/td><td>cool grey, hue 214<\/td><td><code>#7fe6f2<\/code>, <code>#aebfd3<\/code><\/td><td><code>#15727c<\/code>, <code>#4c6a8c<\/code><\/td><\/tr><tr><td>Moss<\/td><td>Green<\/td><td>Sky<\/td><td>green grey, hue 150<\/td><td><code>#8ee3a0<\/code>, <code>#9fd3ff<\/code><\/td><td><code>#1e7831<\/code>, <code>#1b6baf<\/code><\/td><\/tr><tr><td>Tidal<\/td><td>Blue<\/td><td>Aqua<\/td><td>navy grey, hue 222<\/td><td><code>#8fb4ff<\/code>, <code>#7fe3cf<\/code><\/td><td><code>#245fd9<\/code>, <code>#197361<\/code><\/td><\/tr><tr><td>Sakura<\/td><td>Pink<\/td><td>Mint<\/td><td>plum grey, hue 330<\/td><td><code>#ff9fcb<\/code>, <code>#a6ecc9<\/code><\/td><td><code>#c31f6a<\/code>, <code>#197547<\/code><\/td><\/tr><tr><td>Citrus<\/td><td>Lime<\/td><td>Cyan<\/td><td>olive grey, hue 80<\/td><td><code>#cde77a<\/code>, <code>#7fe6f2<\/code><\/td><td><code>#5b7114<\/code>, <code>#15747e<\/code><\/td><\/tr><tr><td>Mono<\/td><td>White<\/td><td>Grey<\/td><td>none<\/td><td><code>#e6e9ed<\/code>, <code>#a9aeb4<\/code><\/td><td><code>#333c47<\/code>, <code>#626971<\/code><\/td><\/tr><tr><td>Windows accent<\/td><td>the Windows accent colour<\/td><td>the accent, greyed<\/td><td>the accent's hue<\/td><td>from <code>#0078d4<\/code>: <code>#61bbff<\/code>, <code>#b6c9d8<\/code><\/td><td><code>#1c6ca9<\/code>, <code>#496c88<\/code><\/td><\/tr><\/tbody><\/table>\n<p>The stored themes in this system are showcase combinations: Arcade in Dark, Light and Pure black, and the other presets in Dark. Every other combination is generated by the same engine; <code>ThemePicker<\/code> and the Settings screen show them all.<\/p>\n<h2>Swatches (v1)<\/h2>\n<p>Primary and secondary can each be swapped for one of eleven swatches: Cyan, Aqua, Sky, Blue, Green, Mint, Lime, Pink, Steel, Grey, White. Each swatch is a light seed; the engine keeps it as is in dark mode (lightening it only if it's too dark) and darkens it in light mode. Show a swatch in the tone it will actually take, as <code>ColorSwatchPicker<\/code> does. Amber and red swatches are left out on purpose: they already mean a status. Green is Playing's too since 1 Oct 2026 (Spotify's green, the owner's choice), so a green primary (Moss, the Green, Mint and Lime swatches) can sit beside it; a status always keeps its icon and word, so they stay told apart.<\/p>\n<h2>How the engine derives each token<\/h2>\n<ul>\n<li><strong>Dark mode<\/strong>: <code>primary<\/code> must reach 7.5:1 on <code>bg-200<\/code> and <code>bg-300<\/code>, <code>secondary<\/code> 6.5:1; <code>on-primary<\/code> and <code>on-secondary<\/code> are the same hue at very low lightness, 7:1 on the fill.<\/li>\n<li><strong>Light mode<\/strong>: the seed's saturation is capped at 72% and it is darkened until it reaches 4.6:1 on <code>bg-300<\/code>; near-white seeds jump straight to a dark slate. <code>on-primary<\/code> and <code>on-secondary<\/code> are white.<\/li>\n<li><strong>Soft grounds<\/strong>: <code>primary-soft<\/code> and <code>secondary-soft<\/code> take the colour's hue at low saturation, dark in dark mode and pale in light mode; the colour itself stays 4.5:1 on its soft ground.<\/li>\n<li><strong>Surfaces<\/strong>: <code>bg-000<\/code> to <code>bg-400<\/code> and <code>line-100<\/code> are fixed lightness steps in the preset's tint hue at 0 to 16% saturation. Pure black sets <code>bg-100<\/code> to <code>#000000<\/code> and lifts cards slightly so they stay visible.<\/li>\n<li><strong>Text and borders<\/strong>: <code>ink-muted<\/code>, <code>ink-faint<\/code> and <code>line-200<\/code> are moved until they pass 6:1, 4.6:1 and 3:1 on every ground they sit on, selection included.<\/li>\n<li>Every preset in every mode, and every swatch in either role, passes these checks; the automated contrast test covers them all.<\/li>\n<\/ul>\n<h2>Custom colours (later)<\/h2>\n<ul>\n<li>Any hex code or colour picker value can be the primary or secondary. It goes through the same engine, so a colour that's too dark or too light is adjusted until it passes, and <code>ColorSwatchPicker<\/code> shows the value actually used and its contrast.<\/li>\n<li>A custom colour within about 22 degrees of amber, red or Playing's green gets a note that statuses keep their icon and word.<\/li>\n<li>Themes export and import as a small file of these four choices.<\/li>\n<\/ul>\n<h2>Surface: Glossy or Solid<\/h2>\n<p>Picked under Appearance → Surface, saved per PC; a fresh install starts in <strong>Glossy<\/strong>.<\/p>\n<ul>\n<li><strong>Solid<\/strong> is the plain look: every surface is opaque and cards sit apart by surface alone. The edge tokens (<code>edge-card<\/code>, <code>edge-control<\/code>, <code>edge-console<\/code>, <code>edge-well<\/code>, <code>edge-dialog<\/code>, <code>edge-art<\/code>) are clear and <code>lift-card<\/code> is none, so Solid looks exactly as it did before Glossy existed.<\/li>\n<li><strong>Glossy<\/strong> puts each page on a blurred, darkened copy of a game's art: the page's own game on game detail and conflict, otherwise the last one played. The art is blurred 64px and saturated 1.3, reaching 140px past each edge of the window, then a scrim darkens it from top to bottom. <code>GameSync.theme.glass(choice, strength)<\/code> gives what changes: the surfaces become see-through, the edges appear (white at 4 to 9%), cards get a lit top edge, dialogs stay nearly opaque.<\/li>\n<li>Three <strong>strengths<\/strong>, by screen:<\/li>\n<\/ul>\n<table><thead><tr><th>Strength<\/th><th>Screens<\/th><th>Page ground<\/th><th>Cards<\/th><th>Rail<\/th><th>Scrim from top to bottom<\/th><\/tr><\/thead><tbody><tr><td><code>glass<\/code><\/td><td>Home, the game library, game detail, conflict, the save manager and its Plan tab<\/td><td><code>bg-000<\/code><\/td><td>white at 5.5%<\/td><td>white at 3%<\/td><td>44%, 70% at 40%, 84%<\/td><\/tr><tr><td><code>home<\/code><\/td><td>none since 1 Oct 2026 (Home and the library, until the owner found their cards grey over the art); kept for a page that wants a step more solid<\/td><td><code>bg-000<\/code><\/td><td>the card colour at 60%<\/td><td><code>bg-100<\/code> at 25%<\/td><td>48%, 77% at 40%, 86% at 68%, 88%<\/td><\/tr><tr><td><code>glow<\/code><\/td><td>first run, settings<\/td><td><code>bg-100<\/code><\/td><td><code>bg-200<\/code> at 82%<\/td><td><code>bg-100<\/code> at 50%<\/td><td>56%, 84% at 36%, 93% at 60%, 95%<\/td><\/tr><\/tbody><\/table>\n<ul>\n<li><strong>A backdrop's colour is capped<\/strong> (LOOK-22, 1 Oct 2026): above an OKLab chroma of 0.10 the art's colour eases towards 0.15, keeping its lightness and hue, so one vivid colour filling the art (Counter-Strike 2's orange) doesn't flood the app, while muted art keeps its colour. The app does it as it makes the backdrop; these previews show the plain saturate(1.3).<\/li>\n<li><strong>Contrast holds over any art<\/strong> (LOOK-18). The scrim's stops are the least darkening; the app measures each picture and darkens a row further wherever the art is bright, just enough that every text colour keeps 4.5:1, and controls and borders 3:1, on every surface over every pixel. Dark art keeps the design's gradient exactly. Its test runs every dark theme and strength over white, black, saturated colours, a bright sky, hard stripes and noise. These previews show the design's stops over dark sample art.<\/li>\n<li><strong>When Glossy goes Solid<\/strong>: in light mode (a light Glossy isn't designed yet), with pure black, when Windows' transparency effects are off, and on a page with no art. The Surface choice stays; the page follows it again when those change.<\/li>\n<li>In the previews, <code>ThemeScope<\/code> with <code>art<\/code> and <code>strength<\/code> draws a page in the Surface picked on the Settings screen, which every screen follows; <code>surface<\/code> fixes it for one scope.<\/li>\n<\/ul>\n<h2>In the app<\/h2>\n<ul>\n<li>Build the colour resources from the four choices at start-up and whenever one changes; nothing restarts. In Glossy, a page's strength lays its see-through surfaces over those resources for the window's frame and page, and the backdrop is made once per game, strength and theme, off the UI thread, as a small blurred picture (no live blur), so it runs on Windows 10 and 11 alike.<\/li>\n<li>Match Windows follows the Windows light or dark setting and changes live when Windows does; the Windows accent preset reads the accent colour the same way.<\/li>\n<li>Save the choices per PC, not in the cloud: each PC keeps its own look.<\/li>\n<li>Windows notifications and the tray menu belong to Windows and follow its theme, not GameSync's.<\/li>\n<\/ul>"};
var themeSel = document.getElementById('theme');
THEMES.forEach(function(t){ var o=document.createElement('option'); o.value=t.id; o.textContent=t.name; themeSel.appendChild(o); });
var current = 'Overview';
function head(){
  return '<style>'+LIB.tokens+'</style><style>'+LIB.css+'</style><script>'+LIB.react+'<\/script><script>'+LIB.reactDom+'<\/script><script>'+LIB.bundle+'<\/script>';
}
function srcdoc(p, theme){
  var s = p.src.replace(/<!--[\s\S]*?-->/, '');
  s = s.replace('<head>', '<head>'+head());
  s = s.replace(/<html([^>]*)>/, function(m, a){ return '<html'+a.replace(/\sdata-theme="[^"]*"/,'')+' data-theme="'+theme+'">'; });
  return s;
}
function render(){
  var theme = themeSel.value, stage = document.getElementById('stage');
  stage.innerHTML = '';
  var doc = DOCS[current];
  document.getElementById('readme').innerHTML = '';
  if (doc) {
    document.getElementById('title').textContent = current;
    document.getElementById('subtitle').textContent = current === 'Overview' ? 'The brand book: voice, colour, type, layout, iconography, imagery' : 'How themes are built from a mode, a preset and two colours';
    document.getElementById('readme').innerHTML = doc;
    return;
  }
  var p = PAGES.filter(function(x){ return x.name===current; })[0];
  document.getElementById('title').textContent = p.name;
  document.getElementById('subtitle').textContent = p.group + (p.subtitle ? ' · ' + p.subtitle : '');
  var box = document.createElement('div'); box.className='frame';
  var f = document.createElement('iframe'); f.title = p.name + ' preview';
  var w = p.width || 0, avail = stage.clientWidth || (document.querySelector('main').clientWidth - 56);
  if (w) { var k = Math.min(1, avail / w); f.style.width = w+'px'; f.style.height = p.height+'px'; box.style.width = w+'px'; box.style.height = p.height+'px'; box.style.transform = 'scale('+k+')'; var wrap=document.createElement('div'); wrap.style.height=(p.height*k)+'px'; wrap.appendChild(box); stage.appendChild(wrap); }
  else { f.style.height = p.height+'px'; box.style.maxWidth='980px'; stage.appendChild(box); }
  box.appendChild(f);
  f.srcdoc = srcdoc(p, theme);
  document.getElementById('readme').innerHTML = p.readme;
}
function nav(){
  var n = document.getElementById('nav'); n.innerHTML='';
  function btn(label){ var b=document.createElement('button'); b.textContent=label; if(label===current) b.setAttribute('aria-current','page'); b.onclick=function(){ current=label; nav(); render(); }; n.appendChild(b); }
  var g0=document.createElement('div'); g0.className='grp'; g0.textContent='Guides'; n.appendChild(g0); btn('Overview'); btn('Theming');
  var last=null;
  PAGES.forEach(function(p){ if(p.group!==last){ var g=document.createElement('div'); g.className='grp'; g.textContent=p.group; n.appendChild(g); last=p.group; } btn(p.name); });
}
themeSel.onchange = render;
window.addEventListener('resize', function(){ if(!DOCS[current]) render(); });
nav(); render();
</script>
